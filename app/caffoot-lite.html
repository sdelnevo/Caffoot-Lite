                                <div class="flex flex-wrap gap-2">${[1,2,3,4].map(h=>`<button type="button" data-action="phase13l-height" data-height="${h}" class="phase13b-secondary ${phase13LHeight===h?'ring-2 ring-indigo-500':''}">${h}U</button>`).join('')}</div>
                                ${(()=>{const runs=phase13LFreeRuns(currentRack,activeRackFace,phase13LHeight);return runs.length?`<p class="text-sm text-slate-800 dark:text-slate-100">${runs.length} possible position(s). Suggested: <strong>U${runs[0]}${phase13LHeight>1?'–U'+(runs[0]+phase13LHeight-1):''}</strong></p><button type="button" data-action="phase13l-mount" data-u="${runs[0]}" class="phase13b-primary">Mount At Suggested U</button>`:'<p class="text-sm text-amber-700 dark:text-amber-300">No contiguous space for this height on this face.</p>';})()}
                            </div>
                            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
                                <h3 class="font-bold text-base text-slate-900 dark:text-white mb-1">Other Side (${activeRackFace === 'front' ? 'Rear' : 'Front'}) Equipment</h3>
                                <p class="text-xs text-slate-500 mb-4">Toggle side view to inspect mounted hardware on the opposite face.</p>
                                <div class="space-y-2 max-h-[250px] overflow-y-auto custom-scrollbar">
                                    ${rackDevices.filter(d => (d.face || 'front') !== activeRackFace).length === 0 ? `<p class="text-xs text-slate-400 italic">No devices mounted on this face.</p>` : ''}
                                    ${rackDevices.filter(d => (d.face || 'front') !== activeRackFace).map(d => `
                                        <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
                                            <div>
                                                <span class="font-medium text-slate-900 dark:text-white">${escapeHtml(d.name)}</span>
                                                <span class="text-slate-400 block font-mono">U${d.rackUStart} • ${escapeHtml(d.primaryIp || 'No IP')}</span>
                                            </div>
                                            <button data-action="rack-face-device" data-face="${escapeHtml(d.face || 'front')}" class="px-2 py-1 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded font-medium text-[10px]">View ${d.face}</button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                    </section>
                    <section class="${phase13BRackTab==='equipment'?'':'hidden'} space-y-4" aria-label="Mounted equipment">
                        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5">
                            <div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><h3 class="font-bold text-slate-900 dark:text-white">Mounted Equipment</h3><p class="text-sm text-slate-600 dark:text-slate-300">${rackDevices.length} device(s) across front and rear. To reposition equipment, use Rack view.</p></div><button type="button" data-action="phase13b-tab" data-tab="view" class="phase13b-primary">Open Rack View</button></div>
                            <div class="mt-4 mb-3 flex items-center justify-between"><h4 class="font-bold">Rack accessories (${rackAccessories.length})</h4></div>
                            ${rackAccessories.length?`<div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-5">${rackAccessories.map(a=>`<div class="flex items-center justify-between gap-2 rounded-xl border border-slate-200 dark:border-slate-600 p-3"><div class="text-sm"><strong>${escapeHtml(a.name||phase13CAccessoryTypes[a.type]?.label||'Accessory')}</strong><div class="text-xs text-slate-600 dark:text-slate-300">${escapeHtml(a.face)} · U${a.startU}${a.heightU>1?'-U'+(a.startU+a.heightU-1):''} · ${a.heightU}U</div></div><button type="button" data-action="phase13c-edit" data-id="${escapeHtml(a.id)}" class="phase13b-secondary">Edit</button></div>`).join('')}</div>`:'<p class="text-sm text-slate-600 dark:text-slate-300 mb-4">No rack accessories added yet.</p>'}
                            ${rackDevices.length ? `<div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead><tr class="text-slate-600 dark:text-slate-300 border-b border-slate-200 dark:border-slate-700"><th class="p-3">Device</th><th class="p-3">Side</th><th class="p-3">Position</th><th class="p-3">IP address</th><th class="p-3">Actions</th></tr></thead><tbody>${[...rackDevices].sort((a,b)=>Number(b.rackUStart)-Number(a.rackUStart)).map(d=>`<tr class="border-b border-slate-100 dark:border-slate-700"><td class="p-3 font-semibold text-slate-900 dark:text-white">${escapeHtml(d.name)}</td><td class="p-3 capitalize">${escapeHtml(d.face||'front')}</td><td class="p-3 font-mono">U${escapeHtml(String(d.rackUStart||'?'))}${Number(d.rackUEnd)>Number(d.rackUStart)?'-U'+escapeHtml(String(d.rackUEnd)):''}</td><td class="p-3 font-mono">${escapeHtml(d.primaryIp||'—')}</td><td class="p-3"><button type="button" data-action="rack-face-device" data-face="${escapeHtml(d.face||'front')}" class="phase13b-secondary">Show In Rack</button></td></tr>`).join('')}</tbody></table></div>` : `<p class="text-sm text-slate-600 dark:text-slate-300">No equipment is mounted in this rack yet. Open Rack view and select an empty U to mount a device.</p>`}
                        </div>
                    </section>
                    <section class="${phase13BRackTab==='settings'?'':'hidden'} space-y-4" aria-label="Rack settings">
                        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5 space-y-4">
                            <div><h3 class="font-bold text-slate-900 dark:text-white">Rack Configuration</h3><p class="text-sm text-slate-600 dark:text-slate-300">Edit rack details, add enclosures, or remove an unused rack.</p></div>
                            <dl class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm"><div><dt class="text-slate-500 dark:text-slate-400">Rack name</dt><dd class="font-semibold">${escapeHtml(currentRack.name)}</dd></div><div><dt class="text-slate-500 dark:text-slate-400">Location</dt><dd class="font-semibold">${escapeHtml(currentRack.location||'Not set')}</dd></div><div><dt class="text-slate-500 dark:text-slate-400">Height</dt><dd class="font-semibold">${Number(currentRack.heightU)||42}U</dd></div><div><dt class="text-slate-500 dark:text-slate-400">Mounted devices</dt><dd class="font-semibold">${rackDevices.length}</dd></div></dl>
                            <div class="flex flex-wrap gap-2"><button data-action="edit-rack" data-id="${escapeHtml(currentRack.id)}" class="phase13b-primary">Edit Rack</button><button data-action="open-rack-modal" class="phase13b-secondary">Add Rack</button><button data-action="delete-rack" data-id="${escapeHtml(currentRack.id)}" class="phase13b-danger">Delete Rack</button></div>

                    </section>
                </div>
            `;
        }

        function changeRack(id) {
            selectedRackId = id;
            renderContent();
        }

        // --- DEVICES VIEW (With Manage Type & Location Buttons) ---
        let phase14DeviceTab = 'inventory';
        let deviceSearchTerm = '';
        let deviceTypeFilter = '';
        let deviceStatusFilter = '';
        let deviceLocationFilter = '';
        let deviceMountFilter = '';
        let deviceSort = 'name-asc';
        function getVisibleDevices() {
            const term = deviceSearchTerm.trim().toLowerCase();
            // Build the rack index once per filter operation, not once per device.
            const validRackIds = deviceMountFilter ? new Set(appState.racks.map(r => String(r.id))) : null;
            const filtered = appState.devices.filter(d =>
                (!deviceTypeFilter || d.type === deviceTypeFilter) &&
                (!deviceStatusFilter || (d.status || 'Active') === deviceStatusFilter) &&
                (!deviceLocationFilter || (d.location || 'Unknown') === deviceLocationFilter) &&
                (!deviceMountFilter || (deviceMountFilter === 'racked' ? validRackIds.has(String(d.rackId)) : !validRackIds.has(String(d.rackId)))) &&
                (!term || [d.name, d.primaryIp, d.type, d.location, d.manufacturer, d.model, d.serialNumber].some(v => String(v || '').toLowerCase().includes(term)))
            );
            const [field, direction] = deviceSort.split('-');
            const property = {name:'name', type:'type', location:'location', ip:'primaryIp'}[field] || 'name';
            return filtered.sort((a,b) => {
                const left = String(a[property] || '');
                const right = String(b[property] || '');
                const cmp = left.localeCompare(right, undefined, {numeric:true, sensitivity:'base'});
                return (direction === 'desc' ? -cmp : cmp) || String(a.id).localeCompare(String(b.id));
            });
        }
        function renderDevicesHTML() {
            return `
                <div class="space-y-5 phase14-devices">
                    <section class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 sm:p-5 space-y-3">
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            <div><h2 class="text-lg font-bold text-slate-900 dark:text-white">Device Management</h2><p class="text-sm text-slate-600 dark:text-slate-300">Find, update and organise your network equipment.</p></div>
                            <button type="button" data-action="open-device-modal" class="h-11 px-4 rounded-xl bg-blue-800 hover:bg-blue-900 text-white font-semibold text-sm"><i class="fa-solid fa-plus mr-2"></i>Add Device</button>
                        </div>
                        <nav class="phase14-tabs" aria-label="Device workspace">
                            ${[['inventory','Inventory','fa-server'],['manage','Types & Locations','fa-sliders']].map(([key,label,icon])=>`<button type="button" data-action="phase14-tab" data-tab="${key}" aria-current="${phase14DeviceTab===key?'page':'false'}" class="phase14-tab ${phase14DeviceTab===key?'phase14-active':''}"><i class="fa-solid ${icon} mr-2"></i>${label}</button>`).join('')}
                        </nav>
                    </section>

                        ${(deviceSearchTerm || deviceTypeFilter || deviceStatusFilter || deviceLocationFilter || deviceMountFilter) ? `<button type="button" data-action="phase14g-clear-filters" class="phase14g-reset"><i class="fa-solid fa-xmark" aria-hidden="true"></i> Clear filters</button>` : ''}

                    <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm phase14f-table-wrap">

                                            <td class="py-3 px-4 font-mono text-xs text-indigo-600">${escapeHtml(d.primaryIp || 'None')}</td>
                                            <td class="py-3 px-4"><span class="inline-flex px-2.5 py-1 rounded-lg text-xs font-semibold ${d.status === 'Retired' ? 'bg-slate-200 text-slate-800 dark:bg-slate-600 dark:text-white' : d.status === 'Maintenance' ? 'bg-amber-100 text-amber-900 dark:bg-amber-950 dark:text-amber-200' : 'bg-emerald-100 text-emerald-900 dark:bg-emerald-950 dark:text-emerald-200'}">${escapeHtml(d.status || 'Active')}</span></td>
                                            <td class="py-3 px-4 text-xs text-slate-700 dark:text-slate-200"><span class="font-semibold">${escapeHtml([d.manufacturer,d.model].filter(Boolean).join(' ') || '—')}</span>${d.serialNumber ? `<span class="block text-slate-600 dark:text-slate-300">S/N ${escapeHtml(d.serialNumber)}</span>` : ''}</td>

                                                            <button type="button" role="menuitem" data-action="edit-device" data-id="${escapeHtml(d.id)}"><i class="fa-solid fa-pen" aria-hidden="true"></i>Edit device</button>

                    </section>
                    <section class="${phase14DeviceTab==='manage'?'':'hidden'} space-y-4" data-device-panel="manage">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 space-y-3">
                                <div class="flex items-center gap-2"><i class="fa-solid fa-tags text-blue-600"></i><h3 class="font-bold text-slate-900 dark:text-white">Device Types</h3></div>

                                <p class="text-sm text-slate-600 dark:text-slate-300">Maintain location choices while preserving special rack handling.</p>

                            </div>

                                <div class="flex items-center gap-2"><i class="fa-solid fa-laptop-code text-blue-600"></i><h3 class="font-bold text-slate-900 dark:text-white">Software Options</h3></div>
                                <p class="text-sm text-slate-600 dark:text-slate-300">Manage optional software checkboxes shown for desktops, laptops and tablets.</p>
                                <button type="button" data-action="phase19b-manage-software" class="h-11 px-4 rounded-xl bg-blue-800 hover:bg-blue-900 text-white font-semibold text-sm">Manage Software Options</button>
                            </div>

                    </section>
                </div>
            `;
        }

        // --- PHASE 18D: MANAGED TYPES & LOCATIONS ---
        let phase18DSearch = {type:'',location:''};
        function phase18DList(kind) {
            const key = kind === 'type' ? 'deviceTypes' : 'deviceLocations';
            const prop = kind === 'type' ? 'type' : 'location';
            const list = Array.isArray(appState[key]) ? appState[key] : [];
            return [...new Set([...list,...appState.devices.map(d=>d[prop])].filter(Boolean))]
                .sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}));
        }
        function getUniqueDeviceTypes() { return [...new Set([...phase18DList('type'), 'Desktop', 'Laptop', 'Tablet', 'Server - Physical', 'Server - Virtual'])]; }
        function getUniqueDeviceLocations() { return phase18DList('location'); }
        function phase18DProtected(kind,name) {
            return name.toLowerCase()==='unknown' || (kind==='location' && name.toLowerCase()==='racked');
        }
        function phase18DOpen(kind) {
            const isType=kind==='type', label=isType?'Device types':'Device locations';
            const search=phase18DSearch[kind].trim().toLowerCase();
            const entries=phase18DList(kind).filter(n=>n.toLowerCase().includes(search));
            const total=phase18DList(kind).length;
            openModal(`
                <div class="p-5 sm:p-7 space-y-4 phase18d-manager">
                    <div class="flex justify-between items-start gap-4 border-b border-slate-200 dark:border-slate-700 pb-4">
                        <div><h3 class="font-bold text-lg text-slate-900 dark:text-white">Manage ${label}</h3>
                        <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">${total} configured · Changes update the device inventory.</p></div>
                        <button type="button" data-action="close-modal" aria-label="Close manager" class="h-10 w-10 rounded-xl border border-slate-300 dark:border-slate-600"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    
                    
                    <div class="space-y-2">
                        <label for="phase18d-new" class="block text-sm font-semibold">Add ${isType?'type':'location'}</label>
                        <div class="flex flex-wrap sm:flex-nowrap gap-2"><input id="phase18d-new" type="text" maxlength="100" placeholder="New ${isType?'type':'location'} name" class="flex-1 min-w-0 h-11 px-3 rounded-xl border border-slate-400 dark:border-slate-500 bg-white dark:bg-slate-800" />
                        <button type="button" data-action="phase18d-add" data-kind="${kind}" class="h-11 px-5 rounded-xl bg-blue-800 hover:bg-blue-900 text-white font-semibold"><i class="fa-solid fa-plus mr-1"></i>Add</button></div>
                    </div>
                    <div class="space-y-2">
                        <label for="phase18d-search" class="block text-sm font-semibold">Search ${label.toLowerCase()}</label>
                        <div class="flex gap-2"><input id="phase18d-search" type="search" value="${escapeHtml(phase18DSearch[kind])}" placeholder="Search by name" class="flex-1 min-w-0 h-11 px-3 rounded-xl border border-slate-400 dark:border-slate-500 bg-white dark:bg-slate-800" />
                        <button type="button" data-action="phase18d-search" data-kind="${kind}" class="h-11 px-4 rounded-xl border border-slate-400 dark:border-slate-500">Search</button></div>
                    </div>
                    <div class="max-h-[min(48vh,390px)] overflow-y-auto custom-scrollbar space-y-2" aria-label="${label}">
                        ${entries.length ? entries.map(name=>{
                            const count=appState.devices.filter(d=>d[isType?'type':'location']===name).length;
                            const protectedItem=phase18DProtected(kind,name);
                            return `<div class="flex flex-wrap sm:flex-nowrap items-center gap-3 p-3 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700">
                                <div class="flex-1 min-w-0"><div class="font-semibold break-words ${name.toLowerCase()==='unknown'?'text-rose-600 dark:text-rose-400':''}">${escapeHtml(name)}</div>
                                <div class="text-xs text-slate-600 dark:text-slate-300 mt-1">${count} device${count===1?'':'s'}${protectedItem?' · Protected':''}</div></div>
                                <div class="flex gap-2"><button type="button" data-action="phase18d-rename" data-kind="${kind}" data-name="${escapeHtml(name)}" ${protectedItem?'disabled':''} aria-label="Rename ${escapeHtml(name)}" class="h-10 px-3 rounded-lg border border-slate-400 dark:border-slate-500 disabled:opacity-40"><i class="fa-solid fa-pen"></i></button>
                                <button type="button" data-action="phase18d-delete" data-kind="${kind}" data-name="${escapeHtml(name)}" ${protectedItem?'disabled':''} aria-label="Delete ${escapeHtml(name)}" class="h-10 px-3 rounded-lg border border-rose-300 text-rose-700 dark:text-rose-300 disabled:opacity-40"><i class="fa-solid fa-trash"></i></button></div>
                            </div>`;
                        }).join('') : `<p class="text-sm text-center py-8 text-slate-600 dark:text-slate-300">No matching ${label.toLowerCase()}.</p>`}
                    </div>
                    <p class="text-xs text-slate-600 dark:text-slate-300">Deleting an in-use entry sets affected devices to Unknown. Racked and Unknown are protected system locations.</p>
                    <div class="flex justify-end border-t border-slate-200 dark:border-slate-700 pt-4"><button type="button" data-action="close-modal" class="h-11 px-5 rounded-xl bg-blue-800 hover:bg-blue-900 text-white font-semibold">Done</button></div>
                </div>`);
        }
        function openManageTypesModal(){phase18DOpen('type');}
        function openManageLocationsModal(){phase18DOpen('location');}
        function phase18DCommit(kind,operation,oldName,newName='') {
            const key=kind==='type'?'deviceTypes':'deviceLocations',prop=kind==='type'?'type':'location';
            const list=phase18DList(kind);
            const name=newName.trim();
            if(operation!=='delete') {
                if(!name){showToast('Enter a name first.','error');return;}
                if(name.length>100){showToast('Name is too long.','error');return;}
                if((name.toLowerCase()==='unknown'||(kind==='location'&&name.toLowerCase()==='racked')) && (operation==='add'||name.toLowerCase()!==oldName?.toLowerCase())){
                    showToast('That name is reserved for a system value.','error');return;
                }
                if(list.some(n=>n.toLowerCase()===name.toLowerCase() && (operation==='add'||n!==oldName))){showToast('That name already exists.','error');return;}
            }
            if(operation!=='add' && (phase18DProtected(kind,oldName)||!list.includes(oldName))){showToast('This entry cannot be changed.','error');return;}
            if(operation==='rename' && oldName===name)return;
            const affected=appState.devices.filter(d=>d[prop]===oldName).length;
            if(operation==='delete' && !confirm(`Delete ${kind} "${oldName}"?\n\n${affected} device(s) will be set to Unknown. This cannot be undone except by restoring a backup.`))return;
            const snapshot=JSON.stringify(appState);
            if(operation==='add')appState[key]=[...new Set([...(appState[key]||[]),name])];
            else if(operation==='rename'){
                appState[key]=[...new Set([...(appState[key]||[]).map(n=>n===oldName?name:n),name])];
                appState.devices.forEach(d=>{if(d[prop]===oldName)d[prop]=name;});
                if(kind==='type' && appState.deviceTypeGraphics && Object.hasOwn(appState.deviceTypeGraphics,oldName)){
                    appState.deviceTypeGraphics[name]=appState.deviceTypeGraphics[oldName];delete appState.deviceTypeGraphics[oldName];
                }
            } else {
                appState[key]=(appState[key]||[]).filter(n=>n!==oldName);
                appState.devices.forEach(d=>{if(d[prop]===oldName)d[prop]='Unknown';});
                if(kind==='type'&&appState.deviceTypeGraphics)delete appState.deviceTypeGraphics[oldName];
            }
            if(!saveState()){
                const prior=JSON.parse(snapshot);Object.keys(appState).forEach(k=>delete appState[k]);Object.assign(appState,prior);
                showToast('Change not saved; original data restored.','error');return;
            }
            showToast(operation==='delete'?`${affected} device(s) set to Unknown; ${kind} deleted.`:`${kind==='type'?'Type':'Location'} ${operation==='add'?'added':'renamed'} successfully.`,'success');
            phase18DOpen(kind);renderContent();
        }
        function editDeviceTypePrompt(n){phase18DRename('type',n);}
        function editDeviceLocationPrompt(n){phase18DRename('location',n);}
        function phase18DRename(kind,n){const next=prompt(`Rename ${kind} "${n}" to:`,n);if(next!==null)phase18DCommit(kind,'rename',n,next);}
        function deleteDeviceType(n){phase18DCommit('type','delete',n);}
        function deleteDeviceLocation(n){phase18DCommit('location','delete',n);}

        // --- MERGED IPAM & VLANs VIEW ---
        let ipamStatusFilter = 'All';
        let ipamAddressSearch = '';
        let phase12CIpamTab = 'overview';
        // Phase 10A: operate on the existing /24 IPAM address grid without
        // assuming that every stored subnet is a /24.
        function phase10GatewaySubnet(ip) {
            return appState.subnets.find(s => s.kind !== 'container' && s.gateway === ip && phase12Usable(ip, s.cidr)) || null;
        }

        function phase10SubnetSummary(subnet) {
            const range=phase12Cidr(subnet?.cidr);
            if(!range) return {supported:false,cidr:subnet?.cidr||'',capacity:0,assigned:0,reserved:0,available:0,next:null,utilisation:0,duplicates:[]};
            const owners=new Map();
            for(const d of appState.devices) {
                if(!phase12Usable(d.primaryIp,subnet.cidr)) continue;
                const arr=owners.get(d.primaryIp)||[];arr.push(d.name||d.id);owners.set(d.primaryIp,arr);
            }
            const duplicates=[...owners].filter(([,a])=>a.length>1).map(([ip,owners])=>({ip,owners}));
            let assigned=0,reserved=0,next=null;
            for(let n=range.first;n<=range.lastHost;n++) {
                const ip=phase12IpString(n), alloc=appState.ipAllocations[ip];
                const status=alloc?.status||(owners.has(ip)?'Assigned':'Available');
                if(status==='Reserved') reserved++;
                else if(status==='Assigned') assigned++;
                else if(ip===subnet.gateway) reserved++; // Protected without writing an allocation record.
                else if(next===null && status==='Available' && !owners.has(ip)) next=ip;
            }
            return {supported:true,cidr:subnet.cidr,capacity:range.capacity,assigned,reserved,
                available:range.capacity-assigned-reserved,next,
                utilisation:Math.round((assigned+reserved)/range.capacity*100),duplicates};
        }

        // v1.1: read-only subnet hierarchy, with native keyboard-accessible disclosure.
        function renderSubnetHierarchyPreview() {
            const subnets = appState.subnets || [];
            const ids = new Set(subnets.map(s => String(s.id)));
            const byParent = new Map();
            for (const subnet of subnets) {
                const parent = subnet.parentId && ids.has(String(subnet.parentId)) ? String(subnet.parentId) : '';
                if (!byParent.has(parent)) byParent.set(parent, []);
                byParent.get(parent).push(subnet);
            }
            const visited = new Set();
            function nodes(parent, ancestry = new Set()) {
                return (byParent.get(parent) || []).map(subnet => {
                    const id = String(subnet.id);
                    if (ancestry.has(id) || visited.has(id)) return '';
                    visited.add(id);
                    const next = new Set(ancestry);
                    next.add(id);
                    const children = nodes(id, next);
                    const isContainer = subnet.kind === 'container';
                    const name = escapeHtml(String(subnet.name || 'Unnamed Subnet'));
                    const cidr = escapeHtml(String(subnet.cidr || ''));
                    const type = isContainer ? 'IP Address Block' : subnet.kind === 'reserved' ? 'Reserved Range' : subnet.kind === 'loopback' ? 'Loopback /32' : 'Network / VLAN';
                    const details = '<span class="ml-2 text-xs font-normal text-slate-500 dark:text-slate-400">' + type + (isContainer ? '' : ' · VLAN ' + escapeHtml(String(subnet.vlan ?? '—'))) + '</span>';
                    const editAction = '<button type="button" data-action="edit-subnet" data-id="' + escapeHtml(id) + '" class="inline-flex align-middle items-center ml-3 px-2 py-1 text-xs font-semibold text-indigo-700 dark:text-indigo-300 hover:underline" aria-label="Edit ' + name + '"><i class="fa-solid fa-pen mr-1"></i>Edit</button>';
                    if (children || isContainer) {
                        return '<details ' + (isContainer ? 'data-ipam-hierarchy-block="' + escapeHtml(id) + '" ' : '') + 'open class="ml-3 my-2 pl-3 border-l-2 border-indigo-200 dark:border-indigo-800"><summary class="cursor-pointer py-2 text-sm font-semibold text-slate-900 dark:text-white"><span class="inline"><i class="fa-solid fa-folder text-indigo-500 mr-2"></i>' + cidr + ' — ' + name + details + '</span>' + editAction + '</summary>' + (children || '<p class="text-xs text-slate-500 dark:text-slate-400 ml-5 py-2">No Child Subnets</p>') + '</details>';
                    }
                    return '<div class="ml-3 my-1 pl-3 py-2 border-l-2 border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-white"><i class="fa-solid fa-network-wired text-indigo-500 mr-2"></i>' + cidr + ' — ' + name + details + editAction + '</div>';
                }).join('');
            }
            const roots = nodes('');
            const orphaned = subnets.filter(subnet => !visited.has(String(subnet.id)));
            return '<section class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3" aria-label="Subnet Hierarchy"><h3 class="font-bold text-base text-slate-900 dark:text-white">Subnet Hierarchy</h3><p class="text-xs text-slate-500 dark:text-slate-400">Expand IP Address Blocks to view child networks. Use Edit to rename or update a subnet.</p>' + (roots || '<p class="text-sm text-slate-500">No Subnets Yet</p>') + (orphaned.length ? '<p class="text-xs text-rose-600">Some subnet relationships could not be displayed.</p>' : '') + '</section>';
        }

        function renderIpamHTML() {
            // v1.1 IPAM Overview stage 1: inventory-wide, read-only totals.
            // Return before selected-network rendering so Overview never depends on its dropdown.
            if (phase12CIpamTab === 'overview') {
                const blocks = appState.subnets.filter(s => s.kind === 'container');
                const networks = appState.subnets.filter(s => (s.kind || 'network') === 'network');
                let capacity = 0, available = 0;
                for (const network of networks) {
                    const summary = phase10SubnetSummary(network);
                    if (!summary.supported) continue;
                    capacity += summary.capacity;
                    available += summary.available;
                }
                const overviewStats = [
                    ['IP Address Blocks', blocks.length],
                    ['Networks', networks.length],
                    ['Usable Addresses', capacity],
                    ['Available Addresses', available]
                ];
                // Native disclosure elements keep large inventories compact and keyboard-accessible.
                const groups = blocks.map(block => ({block, networks: networks.filter(n => String(n.parentId || '') === String(block.id))}));
                const ungrouped = networks.filter(n => !blocks.some(b => String(b.id) === String(n.parentId || '')));
                if (ungrouped.length) groups.push({block:null, networks:ungrouped});
                const networkGroups = groups.map(({block,networks:list}) => {
                    const title = block ? block.name || block.cidr : 'Unassigned Networks';
                    const cidr = block ? block.cidr : 'No parent IP Address Block';
                    const search = [title,cidr,...list.flatMap(n => [n.name,n.cidr,n.vlan,n.description])].join(' ').toLowerCase();
                    return `<button type="button" data-action="ipam-open-block" data-id="${escapeHtml(block?.id || '')}" data-ipam-network-group data-search="${escapeHtml(search)}" class="text-left w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/30 p-4 min-w-0 space-y-2 hover:border-indigo-400 hover:bg-indigo-50 dark:hover:bg-slate-700/60 focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-500 transition-colors">
                        <div class="flex items-start gap-3">
                            <i class="fa-solid fa-layer-group text-indigo-600 dark:text-indigo-400 mt-1" aria-hidden="true"></i>
                            <div class="min-w-0 flex-1">
                                <h5 class="font-semibold text-slate-900 dark:text-white break-words">${escapeHtml(title)}</h5>
                                <p class="text-sm text-slate-600 dark:text-slate-300 break-words mt-1">${escapeHtml(cidr)}</p>
                            </div>
                        </div>
                        <p class="text-xs font-semibold text-slate-600 dark:text-slate-300">${list.length} ${list.length === 1 ? 'network' : 'networks'}</p>
                        <span class="inline-flex items-center gap-2 text-xs font-semibold text-indigo-700 dark:text-indigo-300">View in Manage Subnets <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
                    </button>`;
                }).join('');
                return `<div class="space-y-5" data-ipam-panel="overview">
                    <section class="space-y-3" aria-labelledby="ipam-inventory-overview-heading">
                        <div>
                            <h3 id="ipam-inventory-overview-heading" class="text-lg font-bold text-slate-900 dark:text-white">IPAM Overview</h3>
                            <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">Inventory-wide totals across all Network / VLAN subnets. Parent IP Address Blocks are counted separately and do not add host capacity.</p>
                        </div>
                        <dl class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                            ${overviewStats.map(([label,value]) => `<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5">
                                <dt class="text-sm font-semibold text-slate-600 dark:text-slate-300">${escapeHtml(label)}</dt>
                                <dd class="text-3xl font-bold text-slate-900 dark:text-white mt-2">${Number(value).toLocaleString('en-GB')}</dd>
                            </div>`).join('')}
                        </dl>
                    </section>
                    <section class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 space-y-2" aria-labelledby="ipam-network-summary-heading">
                        <h4 id="ipam-network-summary-heading" class="font-bold text-slate-900 dark:text-white">Network Summary</h4>
                        <label for="ipam-overview-search" class="sr-only">Search blocks or networks by name, CIDR or VLAN</label>
                        <input id="ipam-overview-search" type="search" autocomplete="off" placeholder="Search blocks or networks by name, CIDR or VLAN…" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                        <p id="ipam-overview-search-status" class="text-xs text-slate-600 dark:text-slate-300" role="status">Showing ${groups.length} IP Address Block cards. Select a card to view its networks in Manage Subnets.</p>
                        <div id="ipam-overview-network-groups" class="grid grid-cols-1 lg:grid-cols-2 gap-3">${networkGroups || '<p class="text-sm text-slate-600 dark:text-slate-300">No networks yet. Add a Network / VLAN subnet to begin.</p>'}</div>
                    </section>
                </div>`;
            }
            const subnet = appState.subnets.find(s => s.id === selectedSubnetId && s.kind !== 'container') || appState.subnets.find(s => s.kind !== 'container') || appState.subnets[0];
            
            if (!subnet && appState.subnets.length === 0) {
                return `
                    <div class="space-y-6 text-center py-12">
                        <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto text-slate-400 text-xl">
                            <i class="fa-solid fa-diagram-project"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white">No IP Address Ranges / Subnets Available</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Create a new subnet block to begin managing IP allocations.</p>
                        <button data-action="open-subnet-modal" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold shadow-md">Add Subnet</button>
                    </div>
                `;
            }

            const activeNetwork = subnet?.kind === 'container' ? appState.subnets.find(s => s.kind !== 'container' && phase12Cidr(s.cidr)) : subnet;
            if (subnet?.kind === 'container' && !activeNetwork) {
                if (phase12CIpamTab === 'manage') return renderSubnetHierarchyPreview();
                const blocks = appState.subnets.filter(s => s.kind === 'container');
                const heading = phase12CIpamTab === 'addresses' ? 'IP Addresses' : 'IPAM Overview';
                const blockSummary = phase12CIpamTab === 'overview' ? `<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    ${[['IP Address Blocks', blocks.length], ['Network / VLAN Subnets', 0], ['Host Allocations', 0]].map(([label, value]) => `<div class="rounded-xl border border-slate-200 dark:border-slate-600 p-4"><p class="text-sm text-slate-500 dark:text-slate-300">${label}</p><p class="text-2xl font-bold text-slate-900 dark:text-white">${value}</p></div>`).join('')}
                </div>` : '';
                return `<section class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                    <h3 class="font-bold text-slate-900 dark:text-white">${heading}</h3>
                    ${blockSummary}
                    <p class="text-sm text-slate-600 dark:text-slate-300">No assignable Network / VLAN subnets are available yet. IP Address Blocks organise address space but do not contain individual host allocations.</p>

                </section>`;
            }
            const phase10Summary = phase10SubnetSummary(activeNetwork);
            const baseIpParts = subnet ? subnet.cidr.split('/')[0].split('.') : ['192', '168', '1'];
            const basePrefix = `${baseIpParts[0]}.${baseIpParts[1]}.${baseIpParts[2]}`;
            
            let startHost = 1;
            let endHost = 32;
            if (ipViewRange === '1-32') { startHost = 1; endHost = 32; }
            else if (ipViewRange === '33-64') { startHost = 33; endHost = 64; }
            else if (ipViewRange === '65-128') { startHost = 65; endHost = 128; }
            else if (ipViewRange === '129-192') { startHost = 129; endHost = 192; }
            else if (ipViewRange === '193-254') { startHost = 193; endHost = 254; }
            else if (ipViewRange === 'all') { startHost = 1; endHost = 254; }

            const phase12Range=phase12Cidr(subnet.cidr);
            const phase12Paged=phase12Range.prefix!==24;
            const phase12Pages=Math.ceil(phase12Range.capacity/32);
            phase12Page=Math.max(0,Math.min(phase12Page,phase12Pages-1));
            const phase12Start=phase12Range.first+phase12Page*32;
            const phase12End=Math.min(phase12Range.lastHost,phase12Start+31);
            const networkParent = appState.subnets.find(item => String(item.id) === String(subnet.parentId || ''));
            const networkMask = phase12Range ? phase12IpString((0xFFFFFFFF << (32 - phase12Range.prefix)) >>> 0) : '—';
            const networkInfoItems = [
                ['Network Name', subnet.name || '—'],
                ['Network CIDR', subnet.cidr || '—'],
                ['Subnet Mask', networkMask],
                ['Usable Address Range', phase12Range ? phase12IpString(phase12Range.first) + ' – ' + phase12IpString(phase12Range.lastHost) : '—'],
                ['Gateway', subnet.gateway || 'Not configured'],
                ['VLAN ID', subnet.vlan ?? 'Not configured'],
                ['Parent IP Address Block', networkParent ? networkParent.name + ' (' + networkParent.cidr + ')' : 'None'],
                ['Usable Addresses', phase10Summary.capacity],
                ['Assigned', phase10Summary.assigned],
                ['Reserved', phase10Summary.reserved],
                ['Available', phase10Summary.available]
            ];
            const networkInformationPanel = `<section class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-4" aria-labelledby="network-information-heading">
                <div><h4 id="network-information-heading" class="font-bold text-slate-900 dark:text-white">Network Information</h4>
                <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">Read-only details calculated from the selected network and current inventory.</p></div>
                <dl class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${networkInfoItems.map(([label,value]) => `<div class="rounded-xl bg-slate-50 dark:bg-slate-700/40 border border-slate-200 dark:border-slate-600 p-3 min-w-0">
                        <dt class="text-xs font-semibold text-slate-600 dark:text-slate-300">${escapeHtml(String(label))}</dt>
                        <dd class="mt-1 text-sm font-semibold text-slate-900 dark:text-white break-words">${escapeHtml(String(value))}</dd>
                    </div>`).join('')}
                </dl>
            </section>`;
            const assignedCount = phase10Summary.assigned;
            const reservedCount = phase10Summary.reserved;

            const ipamStatusLegend = `<div class="flex flex-wrap gap-3 text-xs font-semibold text-slate-700 dark:text-slate-200" aria-label="IP address status legend">
                <span class="px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-700">Available</span>
                <span class="px-3 py-2 rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-200">Assigned</span>
                <span class="px-3 py-2 rounded-lg bg-amber-100 text-amber-900 dark:bg-amber-950 dark:text-amber-200">Reserved (including device IPs)</span>
            </div>`;
            let ipListHtml = '';
            if (subnet && phase10Summary.supported) {
                for (let i = (phase12Paged?phase12Start:startHost); i <= (phase12Paged?phase12End:endHost); i++) {
                    const ip = phase12Paged ? phase12IpString(i) : `${basePrefix}.${i}`;
                    const alloc = appState.ipAllocations[ip];
                    const gatewayProtected = ip === subnet.gateway;
                    const status = gatewayProtected && (!alloc || alloc.status === 'Available') ? (appState.devices.some(d => d.primaryIp === ip) ? 'Assigned' : 'Reserved') : (alloc?.status || (appState.devices.some(d => d.primaryIp === ip) ? 'Assigned' : 'Available'));
                    const displayStatus = gatewayProtected ? `Gateway · ${status}` : status;
                    const reservedDevice = alloc?.reservedForDeviceId ? getDeviceById(alloc.reservedForDeviceId) : null;
                    
                    let badgeColor = 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-600';
                    if (status === 'Assigned') badgeColor = 'bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 border-indigo-200 dark:border-indigo-800 font-semibold';
                    if (status === 'Reserved') badgeColor = 'bg-amber-50 text-amber-600 dark:bg-amber-950/50 dark:text-amber-400 border-amber-200 dark:border-indigo-800';

                    if (ipamStatusFilter !== 'All' && status !== ipamStatusFilter) continue;
                    if (ipamAddressSearch.trim() && ![ip, alloc?.hostname, reservedDevice?.name].some(v => String(v || '').toLowerCase().includes(ipamAddressSearch.trim().toLowerCase()))) continue;
                    ipListHtml += `
                        <button type="button" data-action="open-ip" data-ip="${escapeHtml(ip)}" aria-label="View ${escapeHtml(ip)}, ${escapeHtml(displayStatus)}" class="ipam-address-card p-3 rounded-xl border ${badgeColor} cursor-pointer hover:shadow-md transition flex flex-col justify-between space-y-2 text-left focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-500">
                            <div class="flex items-center justify-between">
                                <span class="font-mono text-xs font-bold">${ip}</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded bg-white/80 dark:bg-slate-800/80 shadow-xs">${escapeHtml(displayStatus)}</span>
                            </div>
                            <div class="text-xs truncate">
                                <span class="font-medium text-slate-700 dark:text-slate-200">${reservedDevice && status === 'Reserved' ? 'For: ' + escapeHtml(reservedDevice.name) : (gatewayProtected ? (status === 'Assigned' ? 'Assigned to Network Device' : 'Reserved') : (alloc ? escapeHtml(alloc.hostname || 'Assigned IP') : 'Available'))}</span>
                            </div>
                        </button>
                    `;
                }
            }

            return `
                <div class="space-y-5 phase12c-ipam">
                    <div class="${phase12CIpamTab==='manage'?'':'hidden'} space-y-4" data-ipam-panel="manage">
                    ${renderSubnetHierarchyPreview()}
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700/60 pb-3">
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid fa-tags text-indigo-600 dark:text-indigo-400"></i>
                                <h3 class="font-bold text-base text-slate-900 dark:text-white">Active VLAN Tags & Subnets</h3>
                            </div>
</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            ${appState.vlans.map(v => `
                                <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-700/30 border border-slate-200 dark:border-slate-700 flex flex-col justify-between space-y-3">
                                    <div>
                                        <div class="flex items-center justify-between">
                                            <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800">VLAN ${v.vlanId}</span>
                                            <div class="space-x-1">
                                                <button data-action="open-subnet-by-vlan" data-name="${escapeHtml(v.name)}" class="p-1.5 text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 rounded-lg transition" title="Edit VLAN & Subnet"><i class="fa-solid fa-pen text-xs"></i></button>
                                                <button data-action="delete-vlan" data-id="${escapeHtml(v.id)}" class="p-1.5 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-lg transition" title="Delete VLAN"><i class="fa-solid fa-trash text-xs"></i></button>
                                            </div>
                                        </div>
                                        <h4 class="font-bold text-sm text-slate-900 dark:text-white mt-2">${escapeHtml(v.name)}</h4>
                                        <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 truncate">${escapeHtml(v.description || 'No description')}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    </div>
                    <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center space-x-3 w-full sm:w-auto">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Active Subnet:</label>
                            <select id="subnet-selector" onchange="changeSubnet(this.value)" class="bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm font-semibold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                ${appState.subnets.filter(s => (s.kind || 'network') === 'network').map(s => `
                                    <option value="${escapeHtml(s.id)}" ${s.id === activeNetwork.id ? 'selected' : ''}>${escapeHtml(s.cidr)} (${escapeHtml(s.name)} - VLAN ${escapeHtml(s.vlan)})</option>
                                `).join('')}
                            </select>
                        </div>
                        <div class="${phase12CIpamTab==='manage'?'flex':'hidden'} items-center space-x-2 w-full sm:w-auto justify-end flex-wrap gap-y-2">
                            ${subnet ? `
                                <button data-action="bulk-ip" data-id="${escapeHtml(subnet.id)}" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold transition shadow-sm">
                                    <i class="fa-solid fa-list-check mr-1.5"></i> Bulk Edit Range
                                </button>
                                <button data-action="edit-subnet" data-id="${escapeHtml(subnet.id)}" class="px-3.5 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold transition">
                                    <i class="fa-solid fa-pen mr-1.5"></i> Edit Subnet & VLAN
                                </button>
                                <button data-action="delete-subnet" data-id="${escapeHtml(subnet.id)}" class="px-3.5 py-2 bg-rose-50 dark:bg-rose-950/50 hover:bg-rose-100 text-rose-600 dark:text-rose-400 rounded-xl text-xs font-semibold transition border border-rose-200 dark:border-rose-800">
                                    <i class="fa-solid fa-trash mr-1.5"></i> Delete Range
                                </button>
                            ` : ''}
</div>
                    </div>

                    ${subnet ? `
                        <div class="${phase12CIpamTab==='overview'?'':'hidden'} space-y-4" data-ipam-panel="overview">
                        ${networkInformationPanel}
                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <div class="flex items-center space-x-3">
                                    <h3 class="text-xl font-bold text-slate-900 dark:text-white">${escapeHtml(subnet.cidr)}</h3>
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800">VLAN ${subnet.vlan}</span>
                                </div>
                                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${escapeHtml(subnet.name)} —${escapeHtml(subnet.description || 'No description')}</p>
                            </div>
                            <div class="flex flex-wrap items-center gap-3 text-xs font-mono text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-700/50 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700">
                                <div>Gateway: <span class="text-slate-900 dark:text-white font-bold">${escapeHtml(subnet.gateway)}</span></div>
                                <div>•</div>
                                <div>Assigned: <span class="text-indigo-600 dark:text-indigo-400 font-bold">${assignedCount}</span></div>
                                <div>•</div>
                                <div>Reserved: <span class="text-amber-600 dark:text-amber-400 font-bold">${reservedCount}</span></div>
                                <div>•</div>
                                <div>Free: <span class="text-emerald-600 dark:text-emerald-400 font-bold">${phase10Summary.supported ? phase10Summary.available : '—'}</span></div>

        // Phase 12B: CIDR-aware, bounded bulk edits. Offset 1 is the first usable IP.
        function phase12BBulkPlan(subnet, start, end, status, hostname, notes) {
            const range=phase12Cidr(subnet?.cidr);
            if (!range) return {error:'Unsupported or invalid subnet.'};
            if (!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start||end>range.capacity)
                return {error:`Enter host offsets from 1 to ${range.capacity}, in ascending order.`};
            if (end-start+1>512) return {error:'Maximum 512 addresses per operation. Split larger ranges into batches.'};
            if (!['Reserved','Available'].includes(status)) return {error:'Choose Reserve or Release.'};
            const changes=[],blocked=[];
            for(let offset=start;offset<=end;offset++) {
                const ip=phase12IpString(range.network+offset);
                if (ip === subnet.gateway) { blocked.push(ip); continue; }
                const owners=appState.devices.filter(d=>d.primaryIp===ip);
                const old=appState.ipAllocations[ip];
                if (owners.length || (old?.deviceId && getDeviceById(old.deviceId))) {
                    blocked.push(ip); continue;
                }
                if(status==='Available') {
                    if(old && old.status!=='Available') changes.push({ip,offset,old,updated:null});
                } else {
                    if(old?.status==='Assigned') {blocked.push(ip);continue;}
                    const updated={...old,status:'Reserved',deviceId:'',hostname:hostname?`${hostname}-${offset}`:(old?.hostname||''),notes:notes||old?.notes||''};
                    if(JSON.stringify(old)!==JSON.stringify(updated)) changes.push({ip,offset,old,updated});
                }
            }
            return {changes,blocked,range,status};
        }

        function handleBulkIpSubmit(e,subnetId) {
            e.preventDefault();
            const subnet=appState.subnets.find(s=>s.id===subnetId);

            const sample=plan.changes.slice(0,6).map(x=>x.ip).join(', ');
            openModal(`<div class="p-6 space-y-4"><h3 class="font-bold text-lg text-slate-900 dark:text-white">Confirm bulk ${status==='Reserved'?'reservation':'release'}</h3>

                <button type="button" data-action="phase12b-apply" class="px-4 py-2 rounded-xl bg-blue-800 text-white font-semibold" ${!plan.changes.length?'disabled':''}>Apply ${plan.changes.length} changes</button></div></div>`);
            phase12BPending={subnetId,start,end,status,hostname,notes};
        }
        let phase12BPending=null;
        function phase12BApply() {
            const request=phase12BPending;
            phase12BPending=null;
            if(!request) return showToast('Bulk preview expired. Start again.','error');
            const subnet=appState.subnets.find(s=>s.id===request.subnetId);
            const plan=phase12BBulkPlan(subnet,request.start,request.end,request.status,request.hostname,request.notes);
            if(plan.error||!plan.changes?.length) return showToast(plan.error||'No eligible addresses remain.','error');
            const before=JSON.stringify(appState);
            try {
                localStorage.setItem('caffoot_phase12b_prebulk_snapshot',before);
            } catch(error) {return showToast('Safety snapshot could not be saved. Bulk operation cancelled.','error');}
            for(const change of plan.changes) {
                if(change.updated===null) delete appState.ipAllocations[change.ip];
                else appState.ipAllocations[change.ip]=change.updated;
            }
            nextAuditReason='Bulk IPAM '+request.status.toLowerCase();
            if(!saveState()) {
                appState=JSON.parse(before);
                nextAuditReason='';
                return showToast('Bulk operation was not saved; original inventory restored in memory.','error');
            }
            closeModal();renderContent();
        }

        // Suggest the first usable address when creating a subnet. Manual edits are respected.
        function subnetCidrFeedback(value) {
            const cidr = String(value || '').trim();
            if (!cidr) return {message: 'Enter a network CIDR to suggest a gateway.', invalid: false};
            const parts = cidr.match(/^([^/]+)\/(\d{1,2})$/);
            if (!parts) return {message: 'Use an IPv4 network in CIDR format, for example 192.168.1.0/24.', invalid: true};
            const ip = phase12IpNumber(parts[1]);
            if (ip === null) return {message: 'Enter a valid IPv4 address (four numbers from 0 to 255).', invalid: true};
            const prefix = Number(parts[2]);
            if (prefix < 23 || prefix > 30) return {message: 'Caffoot Lite supports subnet sizes /23 through /30.', invalid: true};
            const size = 2 ** (32 - prefix);
            const network = Math.floor(ip / size) * size;
            if (ip !== network) return {
                message: 'Not a /' + prefix + ' network boundary. Did you mean ' + phase12IpString(network) + '/' + prefix + '?',
                invalid: true
            };
            return {message: 'Suggested gateway: ' + phase12IpString(network + 1) + ' (first usable IP; you can change it)', invalid: false};
        }

        function suggestSubnetGateway() {
            const cidrInput = document.getElementById('sub-cidr');
            const gatewayInput = document.getElementById('sub-gw');
            if (!cidrInput || !gatewayInput) return;
            const form = cidrInput.closest('form[data-form-action="subnet"]');
            if (!form || form.dataset.subnetId) return; // Never overwrite an existing subnet gateway.
            if (document.getElementById('sub-kind')?.value === 'container') { cidrInput.removeAttribute('aria-invalid'); cidrInput.removeAttribute('aria-describedby'); return; }
            const range = phase12Cidr(cidrInput.value.trim());
            const suggestion = range ? phase12IpString(range.first) : '';
            const previous = gatewayInput.dataset.autoGateway || '';
            if (!gatewayInput.value.trim() || gatewayInput.value === previous) {
                gatewayInput.value = suggestion;
                gatewayInput.dataset.autoGateway = suggestion;
            }
            const hint = document.getElementById('sub-gw-hint');
            const feedback = subnetCidrFeedback(cidrInput.value);
            if (hint) {
                hint.textContent = feedback.message;
                hint.classList.toggle('text-red-700', feedback.invalid);
                hint.classList.toggle('dark:text-red-300', feedback.invalid);
                hint.classList.toggle('text-slate-600', !feedback.invalid);
                hint.classList.toggle('dark:text-slate-300', !feedback.invalid);
                hint.setAttribute('role', feedback.invalid ? 'alert' : 'status');
            }
            cidrInput.setAttribute('aria-invalid', feedback.invalid ? 'true' : 'false');
            cidrInput.setAttribute('aria-describedby', 'sub-gw-hint');
        }

        function handleSubnetSubmit(e, subnetId) {
            e.preventDefault();
            const requestedKind = document.getElementById('sub-kind')?.value;
            if (requestedKind === 'container') {
                const cidr = document.getElementById('sub-cidr').value.trim();
                const name = document.getElementById('sub-name').value.trim();
                const description = document.getElementById('sub-desc').value.trim();
                const parentId = document.getElementById('sub-parent').value || null;
                const range = hierarchyParseCidr(cidr);
                if (!range || !range.aligned || !name) {
                    showToast('Enter a valid aligned CIDR and a IP Address Block name.', 'error');
                    return;
                }
                const previous = JSON.stringify(appState);
                const previousSelection = selectedSubnetId;
                const existing = subnetId ? appState.subnets.find(s => s.id === subnetId) : null;
                if (subnetId && (!existing || existing.kind !== 'container')) {
                    showToast('Changing an existing network into a container is not supported.', 'error');
                    return;
                }
                const record = { id: existing ? existing.id : 'sub_' + Date.now(), kind: 'container', cidr, name, description, parentId };
                const candidate = appState.subnets.map(s => s.id === record.id ? record : s);
                if (!existing) candidate.push(record);
                const issues = [...hierarchyValidate(candidate), ...hierarchyValidateTypes(candidate)];
                if (issues.length) {
                    showToast(issues[0], 'error');
                    return;
                }
                appState.subnets = candidate;
                if (!saveState()) {
                    appState = JSON.parse(previous);
                    selectedSubnetId = previousSelection;
                    showToast('Container was not saved. Previous inventory restored.', 'error');
                    return;
                }
                closeModal(true);
                renderContent();
                return;
            }
            if (requestedKind !== 'network') {
                showToast('This subnet type is not available yet.', 'error');
                return;
            }
            const cidr = document.getElementById('sub-cidr').value.trim();
            const name = document.getElementById('sub-name').value.trim();
            const vlanIdVal = parseInt(document.getElementById('sub-vlan').value, 10);
            const gateway = document.getElementById('sub-gw').value.trim();
            const description = document.getElementById('sub-desc').value.trim();
            const parentId = document.getElementById('sub-parent')?.value || null;

            if (!isValidCidr24(cidr)) {
                showToast('Enter a valid network CIDR from /23 to /30 (e.g. 192.168.10.0/24).', 'error');
                return;
            }
            if (!name) {
                showToast('Subnet name is required.', 'error');
                return;
            }
            if (!Number.isInteger(vlanIdVal) || vlanIdVal < 1 || vlanIdVal > 4094) {
                showToast('VLAN ID must be between 1 and 4094.', 'error');
                return;
            }
            if (!isValidIpv4(gateway)) {
                showToast('Gateway must be a valid IPv4 address.', 'error');
                return;
            }
            if (!phase12Usable(gateway, cidr)) {
                showToast('Gateway must be a usable host address within the subnet.', 'error');
                return;
            }

            const duplicateSubnet = appState.subnets.find(s => s.cidr === cidr && s.id !== subnetId);
            if (duplicateSubnet) {
                showToast(`Subnet ${cidr} already exists.`, 'error');
                return;
            }

            // Validate the proposed parent-child relationship before mutating live state.
            // Preserve legacy flat-network records without introducing default fields.
            const existingSubnet = subnetId ? appState.subnets.find(s => s.id === subnetId) : null;
            const proposedSubnet = {
                ...(existingSubnet || {}),
                id: existingSubnet?.id || 'sub_' + Date.now(),
                cidr, name, vlan: vlanIdVal, gateway, description
            };
            if (parentId) proposedSubnet.parentId = parentId;
            else delete proposedSubnet.parentId;
            const proposedSubnets = appState.subnets.filter(s => s.id !== proposedSubnet.id).concat(proposedSubnet);
            const hierarchyIssues = [...hierarchyValidate(proposedSubnets), ...hierarchyValidateTypes(proposedSubnets)];
            if (hierarchyIssues.length) {
                showToast(hierarchyIssues[0], 'error');
                return;
            }
            const otherSubnetWithVlan = appState.subnets.find(s => Number(s.vlan) === vlanIdVal && s.id !== subnetId);
            if (otherSubnetWithVlan) {
                showToast(`VLAN ${vlanIdVal} is already used by ${otherSubnetWithVlan.name}.`, 'error');
                return;
            }

            const otherVlan = appState.vlans.find(v => Number(v.vlanId) === vlanIdVal);
            if (otherVlan && otherVlan.name !== name && !appState.subnets.some(s => Number(s.vlan) === vlanIdVal && s.id === subnetId)) {
                showToast(`VLAN ${vlanIdVal} already exists with the name ${otherVlan.name}.`, 'error');
                return;
            }

            if (appState.devices.some(d => d.primaryIp === gateway) || appState.ipAllocations[gateway]) {
                showToast('Gateway IP is already assigned or reserved. Release that address before using it as a gateway.', 'error');
                return;
            }

            const beforeSubnetSave = JSON.stringify(appState);
            const previousSubnetSelection = selectedSubnetId;
            const previousDeviceDraftSubnet = deviceFormDraft?.subnetId;

            if (subnetId) {
                const sub = appState.subnets.find(s => s.id === subnetId);
                if (!sub) {
                    showToast('Subnet no longer exists.', 'error');
                    return;
                }
                const previousVlanId = Number(sub.vlan);
                if (sub.cidr !== cidr) {
                    const dependentDevices = appState.devices.filter(d => d.primaryIp && ipBelongsToSubnet(d.primaryIp, sub.cidr));
                    const dependentIps = Object.keys(appState.ipAllocations).filter(ip => ipBelongsToSubnet(ip, sub.cidr));
                    if (dependentDevices.length || dependentIps.length) {
                        showToast(`CIDR cannot be changed while ${dependentDevices.length} device(s) and ${dependentIps.length} IPAM allocation(s) depend on the subnet.`, 'error');
                        return;
                    }
                }
                sub.cidr = cidr;
                sub.name = name;
                sub.vlan = vlanIdVal;
                sub.gateway = gateway;
                sub.description = description;
                if (parentId) sub.parentId = parentId;
                else delete sub.parentId;
                if (previousVlanId !== vlanIdVal && !appState.subnets.some(item => item.id !== sub.id && Number(item.vlan) === previousVlanId)) {
                    appState.vlans = appState.vlans.filter(v => Number(v.vlanId) !== previousVlanId);
                }
            } else {
                const newSub = proposedSubnet;
                appState.subnets.push(newSub);
                selectedSubnetId = newSub.id;
                if (deviceFormDraft) deviceFormDraft.subnetId = newSub.id;
            }

            let existingVlan = appState.vlans.find(v => Number(v.vlanId) === vlanIdVal);
            if (existingVlan) {
                existingVlan.name = name;
                existingVlan.description = description;
            } else {
                appState.vlans.push({
                    id: 'vlan_' + Date.now(),
                    vlanId: vlanIdVal,
                    name,
                    description,
                    color: 'indigo'
                });
            }

            if (!saveState()) {
                appState = JSON.parse(beforeSubnetSave);
                selectedSubnetId = previousSubnetSelection;
                if (deviceFormDraft) deviceFormDraft.subnetId = previousDeviceDraftSubnet;
                showToast('Subnet changes were not saved. Previous inventory restored.', 'error');
                return;
            }
            const returnToDevice = !!deviceFormDraft;
            closeModal(true);
            if (returnToDevice) {
                const draftDeviceId = deviceFormDraft.deviceId || null;
                switchTab('devices');
                setTimeout(() => openDeviceModal(draftDeviceId), 0);
            } else {
                renderContent();
            }
        }

        function ipBelongsToSubnet(ip,cidr) { return phase12Usable(ip,cidr); }

        // Phase 11B: refuse destructive operations with dependent records.
        // Users can deliberately detach/reassign dependencies first.
        function phase11BSubnetDependencies(subnet, state=appState) {
            const devices=state.devices.filter(d=>d.primaryIp && ipBelongsToSubnet(d.primaryIp,subnet.cidr));
            const allocations=Object.keys(state.ipAllocations).filter(ip=>ipBelongsToSubnet(ip,subnet.cidr));
            return {devices,allocations};
        }
        function phase11BIntegrityIssues(state=appState) {
            const issues=[];
            const seen=new Map();
            const rackIds=new Set(state.racks.map(r=>r.id));
            for(const d of state.devices) {
                if(d.primaryIp) {
                    if(seen.has(d.primaryIp)) issues.push(`Duplicate primary IP ${d.primaryIp}: ${seen.get(d.primaryIp)} and ${d.name}`);
                    else seen.set(d.primaryIp,d.name);
                    const a=state.ipAllocations[d.primaryIp];
                    if(!a || a.deviceId!==d.id || a.status!==(d.ipReserved?'Reserved':'Assigned'))
                        issues.push(`IPAM mismatch for ${d.name} (${d.primaryIp})`);
                }
                if(d.rackId && !rackIds.has(d.rackId)) issues.push(`Missing rack for ${d.name}`);
            }
            const deviceIds=new Set(state.devices.map(d=>d.id));
            for(const [ip,a] of Object.entries(state.ipAllocations)) {
                if(a?.deviceId && !deviceIds.has(a.deviceId)) issues.push(`Orphaned IPAM device link at ${ip}`);
                if(a?.reservedForDeviceId && !deviceIds.has(a.reservedForDeviceId)) issues.push(`Orphaned IPAM reservation at ${ip}`);
            }
            return issues;
        }
        function phase11BCommitDelete(before, label) {
            if(saveState()) { renderContent(); return true; }
            appState=JSON.parse(before);
            renderContent();
            showToast(`${label} was not deleted because the changes could not be saved.`, 'error');
            return false;
        }
        function deleteSubnet(subId) {
            const subnet=appState.subnets.find(x=>x.id===subId);
            if(!subnet) return;
            const deps=phase11BSubnetDependencies(subnet);
            if(deps.devices.length || deps.allocations.length) {
                showToast(`Cannot delete ${subnet.name}: ${deps.devices.length} device(s) and ${deps.allocations.length} IPAM allocation(s) depend on it. Reassign or clear them first.`, 'error');
                return;
            }
            if(!confirm(`Delete subnet ${subnet.name} (${subnet.cidr})? This cannot be undone.`)) return;
            const before=JSON.stringify(appState);
            const previousSelection=selectedSubnetId;
            appState.subnets=appState.subnets.filter(x=>x.id!==subId);
            selectedSubnetId=appState.subnets[0]?.id||'';
            if(!phase11BCommitDelete(before,'Subnet')) { selectedSubnetId=previousSelection; renderContent(); }
        }

        function deleteVlan(vId) {
            const vlan = appState.vlans.find(v => v.id === vId);
            if (!vlan) return;
            // Match VLAN number AND parent block. Legacy records without parentId share the unassigned domain.
            // This prevents a VLAN deletion in one block from depending on unrelated blocks.
            const vlanDomain = vlan.parentId || '__unassigned__';
            const linkedSubnets = appState.subnets.filter(s =>
                (!s.kind || s.kind === 'network') &&
                Number(s.vlan) === Number(vlan.vlanId) &&
                (s.parentId || '__unassigned__') === vlanDomain
            );
            if (linkedSubnets.length) {
                showToast('Delete or reassign the linked subnet before deleting this VLAN.', 'error');
                return;
            }
            if (confirm('Delete this VLAN?')) {
                const before = JSON.stringify(appState);
                appState.vlans = appState.vlans.filter(v => v.id !== vId);
                phase11BCommitDelete(before, 'VLAN');
            }
        }

        function handleIpSubmit(e, ip) {

            if (primaryDevice) {

        // RC1 accessibility: modal focus is contained and returned to its trigger.
        let modalReturnFocus = null;
        // Keep the live device form (including unsaved input values) while managing options.
        let deviceOptionsReturnContent = null;
        function phase19BKeepDeviceForm() {
            if (deviceOptionsReturnContent) return;
            const content = document.getElementById('modal-content');
            if (!content?.querySelector('form[data-device-form="true"]')) return;
            phase19BReadFields();
            deviceOptionsReturnContent = document.createDocumentFragment();
            while (content.firstChild) deviceOptionsReturnContent.appendChild(content.firstChild);
        }
        // Compare current field values with the initial form, not merely whether a field was touched.
        const modalFormSnapshots = new WeakMap();
        function modalFormSnapshot(form) {
            return JSON.stringify(Array.from(form.querySelectorAll('input,select,textarea'))
                .filter(field => !['button','submit','reset','hidden'].includes(field.type))
                .map(field => [field.id || field.name || '', field.type, field.type === 'checkbox' || field.type === 'radio' ? field.checked : field.value]));
        }
        function rememberModalForm() {
            const form = document.querySelector('#modal-content form[data-device-form="true"], #modal-content form[data-form-action="subnet"], #modal-content form[data-form-action="rack"], #modal-content form[data-form-action="ip"], #modal-content form[data-form-action="assign"], #modal-content form[data-form-action="bulk-ip"]');
            if (form) modalFormSnapshots.set(form, modalFormSnapshot(form));

        function closeModal(force = false) {
            if (deviceOptionsReturnContent) {
                phase19BReadSoftwareSelections();
                phase19BReadFunctionSelections();
                const content = document.getElementById('modal-content');
                content.replaceChildren(deviceOptionsReturnContent);
                deviceOptionsReturnContent = null;
                phase19BRefreshFields();
                content.querySelector('form[data-device-form="true"]')?.querySelector('input,select,textarea')?.focus();
                return;
            }
            const editableForm = document.querySelector('#modal-content form[data-device-form="true"], #modal-content form[data-form-action="subnet"], #modal-content form[data-form-action="rack"], #modal-content form[data-form-action="ip"], #modal-content form[data-form-action="assign"], #modal-content form[data-form-action="bulk-ip"]');
            if (!force && editableForm && modalFormSnapshots.has(editableForm) &&
                modalFormSnapshot(editableForm) !== modalFormSnapshots.get(editableForm) &&
                !window.confirm('Discard unsaved changes?')) return;

            container.classList.add('hidden');

        function openModal(htmlContent) {

        document.addEventListener('keydown', function(event) {

            if (event.key !== 'Tab') return;
            const items = Array.from(container.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(el => el.getClientRects().length);
            if (!items.length) { event.preventDefault(); document.getElementById('modal-content').focus(); return; }

            // keyboard settings. Advance explicitly through every dialog control.
            const current = items.indexOf(document.activeElement);
            const next = event.shiftKey
                ? (current <= 0 ? items.length - 1 : current - 1)

            event.preventDefault();
            items[next].focus();
        });

        function handleRackSubmit(e, rackId) {
            e.preventDefault();
            const name = document.getElementById('rack-name').value.trim();
            if (!name) { showToast('Rack name is required.', 'error'); return; }
            const before = JSON.stringify(appState);
            const heightU = parseInt(document.getElementById('rack-height').value);
            const depth = document.getElementById('rack-depth').value;
            const location = document.getElementById('rack-location').value;

            if (rackId) {
                const r = appState.racks.find(item => item.id === rackId);
                if (r) {
                    const outOfBoundsDevice = appState.devices.find(d => {
                        if (d.rackId !== rackId) return false;
                        const endU = Number(d.rackUEnd || d.rackUStart);
                        return Number.isInteger(endU) && endU > heightU;
                    });

                    if (outOfBoundsDevice) {
                        showToast(`${outOfBoundsDevice.name} occupies U${outOfBoundsDevice.rackUEnd || outOfBoundsDevice.rackUStart}, so the rack cannot be reduced to ${heightU}U.`, 'error');
                        return;
                    }

                    const outOfBoundsAccessory = (appState.rackAccessories || []).find(a =>
                        a.rackId === rackId && Number(a.startU) + Number(a.heightU) - 1 > heightU
                    );
                    if (outOfBoundsAccessory) {
                        showToast(`${outOfBoundsAccessory.name || 'A rack accessory'} occupies U${Number(outOfBoundsAccessory.startU) + Number(outOfBoundsAccessory.heightU) - 1}, so the rack cannot be reduced to ${heightU}U.`, 'error');
                        return;
                    }

                    r.name = name;
                    r.heightU = heightU;
                    r.depth = depth;
                    r.location = location;
                }
            } else {
                const newRack = { id: 'rack_' + Date.now(), name, heightU, depth, type: 'Free Standing', location };
                appState.racks.push(newRack);
                selectedRackId = newRack.id;
            }
            if (!saveState()) {
                appState = JSON.parse(before);
                showToast('Rack changes were not saved. Please check the validation message.', 'error');
                return;
            }
            closeModal(true);
            renderContent();
        }

        function deleteRack(rackId) {
            const rack=appState.racks.find(r=>r.id===rackId);
            if(!rack) return;
            const mounted=appState.devices.filter(d=>d.rackId===rackId);
            if(mounted.length || (appState.rackAccessories||[]).some(a=>a.rackId===rackId)) {
                showToast(`Cannot delete ${rack.name}: remove mounted devices and accessories first.`, 'error');
                return;
            }
            if(!confirm(`Delete empty rack ${rack.name}? This cannot be undone.`)) return;
            const before=JSON.stringify(appState);
            const previousSelection=selectedRackId;
            appState.racks=appState.racks.filter(r=>r.id!==rackId);
            selectedRackId=appState.racks[0]?.id||'';
            if(!phase11BCommitDelete(before,'Rack')) { selectedRackId=previousSelection; renderContent(); }
        }
