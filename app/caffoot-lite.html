<style id="ui-accessibility-pass">
/* Page-level accessibility and theme consistency pass */
:root {
  --ui-text: #172033;
  --ui-text-muted: #4b5563;
  --ui-text-subtle: #6b7280;
  --ui-border: #cbd5e1;
  --ui-border-strong: #94a3b8;
  --ui-surface: #ffffff;
  --ui-surface-alt: #f8fafc;
  --ui-hover: #f1f5f9;
  --ui-focus: #2563eb;
}
.dark {
  --ui-text: #f8fafc;
  --ui-text-muted: #d1d5db;
  --ui-text-subtle: #cbd5e1;
  --ui-border: #475569;
  --ui-border-strong: #64748b;
  --ui-surface: #111827;
  --ui-surface-alt: #1f2937;
  --ui-hover: #273449;
  --ui-focus: #60a5fa;
}

body { color: var(--ui-text); }
.text-gray-400, .text-gray-500 { color: var(--ui-text-muted) !important; }
.text-gray-600, .text-gray-700 { color: var(--ui-text-muted) !important; }
.dark .text-gray-400, .dark .text-gray-500,
.dark .text-gray-600, .dark .text-gray-700 { color: var(--ui-text-muted) !important; }

.border-gray-100, .border-gray-200, .border-gray-300 { border-color: var(--ui-border) !important; }
.dark .border-gray-600, .dark .border-gray-700 { border-color: var(--ui-border) !important; }

.bg-gray-50 { background-color: var(--ui-surface-alt) !important; }
.dark .bg-gray-50 { background-color: var(--ui-surface-alt) !important; }
.dark .bg-gray-800, .dark .bg-gray-900 { background-color: var(--ui-surface) !important; }

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--ui-focus) !important;
  outline-offset: 2px;
}

input, select, textarea {
  border-color: var(--ui-border-strong);
}
input::placeholder, textarea::placeholder { color: var(--ui-text-subtle); opacity: 1; }
.dark input::placeholder, .dark textarea::placeholder { color: var(--ui-text-subtle); opacity: 1; }

/* Tables: clearer row separation and hover contrast */
thead th { border-bottom-color: var(--ui-border-strong) !important; }
tbody tr { border-bottom-color: var(--ui-border) !important; }
tbody tr:hover { background-color: var(--ui-hover) !important; }
.dark tbody tr:hover { background-color: var(--ui-hover) !important; }

/* Status badges retain semantic colour while improving text contrast. */
.badge, [class*="rounded-full"] { text-shadow: none; }

/* Navigation and clickable cards */
nav a:hover, nav button:hover { background-color: var(--ui-hover); }

/* Empty states and helper text should remain readable in both themes. */
.empty-state, .text-sm.text-gray-500, .text-xs.text-gray-500 { color: var(--ui-text-muted) !important; }

/* Preserve readable disabled controls while clearly communicating disabled state. */
button:disabled, input:disabled, select:disabled, textarea:disabled {
  opacity: .65;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

<style id="phase18a-ui-consistency">
/* Phase 18A: accessible, consistent application controls without changing rack geometry. */
:root { --phase18-focus:#2563eb; --phase18-control-border:#94a3b8; }
.dark { --phase18-focus:#93c5fd; --phase18-control-border:#64748b; }
/* Use a visible keyboard-only focus indicator, including dynamically rendered controls. */
#app :is(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible,
#modal-container :is(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible {
  outline:3px solid var(--phase18-focus) !important;
  outline-offset:2px !important;
}
/* Match control heights while leaving checkbox, radio, file inputs and rack elements untouched. */
#main-content :is(input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]),select),
#modal-content :is(input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]),select) {
  box-sizing:border-box;
  min-height:44px;
}
#main-content textarea,#modal-content textarea { box-sizing:border-box; min-height:88px; }
#main-content :is(input,select,textarea):disabled,
#modal-content :is(input,select,textarea):disabled { opacity:.65; cursor:not-allowed; }
#main-content :is(input,select,textarea):not(:disabled),
#modal-content :is(input,select,textarea):not(:disabled) { max-width:100%; }
/* Prevent overflow in narrow form and dashboard grids. */
#main-content .grid > *,#modal-content .grid > * { min-width:0; }
#main-content table,#modal-content table { border-collapse:separate; border-spacing:0; }
#main-content th { line-height:1.4; }
#main-content td { line-height:1.45; }
/* Keyboard focus must remain clear against both sidebar themes. */
#sidebar .nav-btn:focus-visible { outline-offset:-3px !important; }
/* Avoid animation discomfort without disabling drag and drop. */
@media (prefers-reduced-motion:reduce) {
  #app *,#modal-container *,#toast { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

  #main-content { padding:14px; }

    <script>
        const defaultData = {
            subnets: [],
            vlans: [],
            racks: [],
            devices: [],
            rackAccessories: [],
            deviceTypes: ['Server - Physical', 'Server - Virtual', 'Desktop', 'Laptop', 'Tablet', 'Switch', 'Layer 3 Switch', 'Router', 'Firewall', 'NAS', 'Access Point', 'PDU', 'UPS', 'Unknown'],
            deviceTypeGraphics: {},
            deviceLocations: ['Racked', 'Unknown'],
            ipAllocations: {},
            serverFunctions: [],
            installedSoftware: [],
            managedOptionsCleared: false
        };

        const STATE_VERSION = 3;

        function cloneDefaultData() {
            return JSON.parse(JSON.stringify(defaultData));
        }

        function isPlainObject(value) {
            return value !== null && typeof value === 'object' && !Array.isArray(value);
        }

        function isValidIpv4(ip) {
            const parts = String(ip || '').trim().split('.');
            return parts.length === 4 && parts.every(part => {
                if (!/^\d{1,3}$/.test(part)) return false;
                const n = Number(part);
                return n >= 0 && n <= 255;
            });
        }

        // Phase 12A: unsigned IPv4 math; supported host ranges /23 through /30.
        function phase12IpNumber(ip) {
            if (!isValidIpv4(ip)) return null;
            return ip.split('.').reduce((n,part)=>((n*256)+Number(part)),0);
        }
        function phase12IpString(n) {
            return [24,16,8,0].map(shift=>Math.floor(n/2**shift)%256).join('.');
        }
        function phase12Cidr(cidr) {
            const m=String(cidr||'').match(/^([^/]+)\/(\d{1,2})$/);
            if(!m) return null;
            const prefix=Number(m[2]), raw=phase12IpNumber(m[1]);
            if(raw===null||prefix<23||prefix>30) return null;
            const size=2**(32-prefix), network=Math.floor(raw/size)*size;
            if(raw!==network) return null;
            return {prefix,network,last:network+size-1,first:network+1,lastHost:network+size-2,capacity:size-2,size};
        }
        function phase12Overlap(a,b) {
            const x=phase12Cidr(a),y=phase12Cidr(b);
            return !!(x&&y&&x.network<=y.last&&y.network<=x.last);
        }
        function phase12Usable(ip,cidr) {
            const x=phase12Cidr(cidr),n=phase12IpNumber(ip);
            return !!(x&&n!==null&&n>=x.first&&n<=x.lastHost);
        }
        function isValidCidr24(cidr) { return !!phase12Cidr(cidr); }

// Pure IPv4 hierarchy validation. No DOM, storage, or network dependencies.
// This file is the testable foundation for the upcoming app integration.
function hierarchyIpNumber(ip) {
  const parts=String(ip).split('.');
  if(parts.length!==4 || !parts.every(p=>/^\d{1,3}$/.test(p)&&Number(p)<=255)) return null;
  return parts.reduce((n,p)=>n*256+Number(p),0);
}
function hierarchyIpString(n) { return [24,16,8,0].map(k=>Math.floor(n/2**k)%256).join('.'); }
function hierarchyParseCidr(value,{minPrefix=0,maxPrefix=32}={}) {
  const m=/^([^/]+)\/(\d{1,2})$/.exec(String(value));
  if(!m) return null;
  const raw=hierarchyIpNumber(m[1]),prefix=Number(m[2]);
  if(raw===null||prefix<minPrefix||prefix>maxPrefix) return null;
  const size=2**(32-prefix),start=Math.floor(raw/size)*size;
  return {prefix,start,end:start+size-1,size,aligned:raw===start,canonical:hierarchyIpString(start)+'/'+prefix};
}
function hierarchyValidate(subnets) {
  const errors=[];
  if(!Array.isArray(subnets)) return ['Subnets must be an array.'];
  const ids=new Map(),cidrs=new Set(),ranges=new Map();
  for(const s of subnets) {
    if(!s||typeof s!=='object'||Array.isArray(s)||typeof s.id!=='string'||!s.id.trim()) {errors.push('Subnet ID is missing.');continue;}
    if(ids.has(s.id)) { errors.push('Duplicate subnet ID: '+s.id); continue; }
    ids.set(s.id,s);
    const kind=s.kind===undefined?'network':s.kind;
    if(kind!=='network'&&kind!=='container'&&kind!=='reserved'&&kind!=='loopback') { errors.push('Invalid subnet kind: '+s.id); continue; }
    if(s.parentId!==undefined&&s.parentId!==null&&s.parentId!==''&&typeof s.parentId!=='string') errors.push('Invalid parent ID for '+s.id);
    const range=hierarchyParseCidr(s.cidr,{minPrefix:kind==='container'||kind==='reserved'?0:kind==='loopback'?32:1,maxPrefix:kind==='loopback'?32:32});
    if(!range) errors.push('Invalid CIDR for '+s.id+': '+s.cidr);
    else if(!range.aligned) errors.push('Misaligned CIDR '+s.cidr+'; use '+range.canonical);
    else {
      ranges.set(s.id,range);
      if(cidrs.has(range.canonical)) errors.push('Duplicate CIDR: '+range.canonical);
      cidrs.add(range.canonical);
    }
  }
  for(const s of subnets) {
    if(!s||!s.id||!ranges.has(s.id)) continue;
    const parentId=typeof s.parentId==='string'?s.parentId:null;
    if(!parentId) continue;
    if(parentId===s.id) {errors.push('Subnet cannot parent itself: '+s.id);continue;}
    const p=ids.get(parentId);
    if(!p) {errors.push('Missing parent '+parentId+' for '+s.id);continue;}
    if(p.kind!=='container') errors.push('Parent must be a container: '+parentId);
    const child=ranges.get(s.id),parent=ranges.get(parentId);
    if(parent&&!(parent.start<=child.start&&child.end<=parent.end&&child.size<parent.size))
      errors.push('Child '+s.id+' is not strictly inside parent '+parentId);
    const seen=new Set([s.id]);
    let cursor=p;
    while(cursor) {
      if(seen.has(cursor.id)) {errors.push('Parent cycle involving '+s.id);break;}
      seen.add(cursor.id);
      cursor=cursor.parentId?ids.get(cursor.parentId):null;
    }
  }
  // Every intersecting pair must have an explicit ancestor relationship.
  function ancestor(ancestorId,childId) {
    const seen=new Set();
    let s=ids.get(childId);
    while(s&&s.parentId&&!seen.has(s.id)) {
      seen.add(s.id);
      if(s.parentId===ancestorId) return true;
      s=ids.get(s.parentId);
    }
    return false;
  }

    const x=ranges.get(a.id),y=ranges.get(b.id);

  }

}

function hierarchyValidateTypes(subnets) {
  if(!Array.isArray(subnets)) return ['Subnets must be an array.'];
  const errors=[];
  for(const s of subnets) {
    if(!s||typeof s!=='object'||Array.isArray(s)) {errors.push('Invalid subnet record.');continue;}
    const kind=s.kind===undefined?'network':s.kind;
    if(!['network','container','reserved','loopback'].includes(kind)) {
      errors.push('Invalid subnet kind: '+String(s.id));continue;
    }
    const range=hierarchyParseCidr(s.cidr);
    if(!range||!range.aligned) {errors.push('Invalid subnet CIDR: '+String(s.cidr));continue;}
    if(kind==='network') {
      if(range.prefix>30||range.prefix<1) errors.push('Network requires a /1–/30 CIDR: '+s.cidr);
      const vlan=Number(s.vlan);
      if(s.vlan===null||s.vlan===undefined||s.vlan===''||!Number.isInteger(vlan)||vlan<1||vlan>4094)
        errors.push('Network requires VLAN 1–4094: '+String(s.id));
      const gateway=hierarchyIpNumber(s.gateway);
      if(gateway===null||gateway<=range.start||gateway>=range.end)
        errors.push('Network requires a usable gateway: '+String(s.id));
    } else {
      if(kind==='loopback'&&range.prefix!==32) errors.push('Loopback requires /32: '+String(s.id));
      if(s.gateway!==undefined&&s.gateway!==null&&s.gateway!=='')
        errors.push(kind+' must not have a gateway: '+String(s.id));
      if(s.vlan!==undefined&&s.vlan!==null&&s.vlan!=='')
        errors.push(kind+' must not have a VLAN: '+String(s.id));
    }
  }
  return errors;
}
        function normaliseState(raw) {
            if (!isPlainObject(raw)) throw new Error('Imported data must be a JSON object.');

            const requiredArrays = ['subnets', 'vlans', 'racks', 'devices'];
            for (const key of requiredArrays) {
                if (!Array.isArray(raw[key])) {
                    throw new Error(`Imported data is missing a valid ${key} array.`);
                }
            }
            if (!isPlainObject(raw.ipAllocations)) {
                throw new Error('Imported data is missing a valid ipAllocations object.');
            }

            const state = {
                ...cloneDefaultData(),
                ...raw,
                stateVersion: STATE_VERSION,
                subnets: raw.subnets,
                vlans: raw.vlans,
                racks: raw.racks,
                devices: raw.devices,
                rackAccessories: Array.isArray(raw.rackAccessories) ? raw.rackAccessories : [],
                deviceTypes: Array.isArray(raw.deviceTypes) ? raw.deviceTypes : cloneDefaultData().deviceTypes,
                deviceTypeGraphics: isPlainObject(raw.deviceTypeGraphics) ? raw.deviceTypeGraphics : {},
                deviceLocations: Array.isArray(raw.deviceLocations) ? raw.deviceLocations : cloneDefaultData().deviceLocations,
                ipAllocations: raw.ipAllocations
            };

            // Migrate older saves which did not have managed type/location lists.
            const discoveredTypes = state.devices.map(d => String(d.type || '').trim()).filter(Boolean);
            const discoveredLocations = state.devices.map(d => String(d.location || '').trim()).filter(Boolean);
            state.deviceTypes = [...new Set([...state.deviceTypes, ...discoveredTypes, 'Layer 3 Switch'])];
            state.deviceLocations = [...new Set([...state.deviceLocations, ...discoveredLocations, 'Unknown'])].filter(location => location !== 'Blank');

            // Phase 5 migration: Blank is no longer a valid managed location.
            state.devices.forEach(device => {
                if (device.location === 'Blank' || !device.location) device.location = 'Unknown';
            });

            for (const subnet of state.subnets) {
                // Hierarchical address blocks are validated by the shared hierarchy validators below.
                // Do not apply legacy /23–/30, VLAN and gateway requirements to them.
                if (isPlainObject(subnet) && subnet.kind && subnet.kind !== 'network') continue;
                if (!isPlainObject(subnet) || !subnet.id || !subnet.name || !isValidCidr24(subnet.cidr)) {
                    throw new Error('Every subnet must have an id, name and valid /23–/30 CIDR.');
                }
                if (!Number.isInteger(Number(subnet.vlan)) || Number(subnet.vlan) < 1 || Number(subnet.vlan) > 4094) {
                    throw new Error(`Invalid VLAN ID on subnet ${subnet.name}.`);
                }
                if (!isValidIpv4(subnet.gateway)) {
                    throw new Error(`Invalid gateway on subnet ${subnet.name}.`);
                }
                if (!phase12Usable(subnet.gateway, subnet.cidr)) {
                    throw new Error(`Gateway ${subnet.gateway} does not belong to subnet ${subnet.cidr}.`);

            const hierarchyErrors = hierarchyValidate(state.subnets);
            if (hierarchyErrors.length) throw new Error(hierarchyErrors[0]);
            const typeErrors = hierarchyValidateTypes(state.subnets);
            if (typeErrors.length) throw new Error(typeErrors[0]);

            const vlanIds = new Set();
            const vlanNumbers = new Set();
            for (const vlan of state.vlans) {
                if (!isPlainObject(vlan) || !vlan.id || !vlan.name) throw new Error('Every VLAN must have an id and name.');
                const vlanNumber = Number(vlan.vlanId);
                if (!Number.isInteger(vlanNumber) || vlanNumber < 1 || vlanNumber > 4094) throw new Error(`Invalid VLAN ID: ${vlan.vlanId}.`);
                if (vlanIds.has(vlan.id)) throw new Error(`Duplicate VLAN ID: ${vlan.id}.`);
                if (vlanNumbers.has(vlanNumber)) throw new Error(`Duplicate VLAN number: ${vlanNumber}.`);
                vlanIds.add(vlan.id);
                vlanNumbers.add(vlanNumber);
            }

            const deviceIds = new Set();
            for (const device of state.devices) {
                if (!isPlainObject(device) || !device.id || !device.name) throw new Error('Every device must have an id and name.');
                if (deviceIds.has(device.id)) throw new Error(`Duplicate device ID: ${device.id}.`);
                deviceIds.add(device.id);
                if (device.primaryIp && !isValidIpv4(device.primaryIp)) throw new Error(`Invalid primary IP on device ${device.name}.`);
                if (device.mountType === 'Rack Mounted' || device.rackId) {
                    if (device.mountType !== 'Rack Mounted') throw new Error(`Device ${device.name} has a rack assignment but is not Rack Mounted.`);
                    if (device.location !== 'Racked') throw new Error(`Rack Mounted device ${device.name} must use the Racked location.`);
                    if (!device.rackId || !state.racks.some(r => r.id === device.rackId)) throw new Error(`Device ${device.name} references a missing rack.`);
                    if (!['front','rear'].includes(device.face || 'front')) throw new Error(`Invalid rack face on device ${device.name}.`);
                    if (!Number.isInteger(Number(device.rackUStart)) || !Number.isInteger(Number(device.rackUHeight)) || Number(device.rackUStart) < 1 || Number(device.rackUHeight) < 1) throw new Error(`Invalid rack position on device ${device.name}.`);
                    const expectedEnd = Number(device.rackUStart) + Number(device.rackUHeight) - 1;
                    if (Number(device.rackUEnd) !== expectedEnd) throw new Error(`Rack end U is inconsistent for device ${device.name}.`);
                    const rack = state.racks.find(r => r.id === device.rackId);
                    if (expectedEnd > Number(rack.heightU)) throw new Error(`Device ${device.name} exceeds rack capacity.`);
                } else if (device.location === 'Racked') {
                    throw new Error(`Racked device ${device.name} is missing a rack assignment.`);
                }
            }

            const primaryIps = new Set();
            for (const device of state.devices) {
                if (device.primaryIp) {
                    if (primaryIps.has(device.primaryIp)) throw new Error(`Duplicate primary IP: ${device.primaryIp}.`);
                    primaryIps.add(device.primaryIp);
                    const owningSubnet = state.subnets.find(subnet => ipBelongsToSubnet(device.primaryIp, subnet.cidr));
                    if (!owningSubnet) throw new Error(`Primary IP ${device.primaryIp} on device ${device.name} does not belong to an existing subnet.`);
                }
            }

            for (const [ip, allocation] of Object.entries(state.ipAllocations)) {
                if (!isValidIpv4(ip) || !isPlainObject(allocation)) {
                    throw new Error(`Invalid IP allocation record: ${ip}.`);
                }
                if (!state.subnets.some(subnet => ipBelongsToSubnet(ip, subnet.cidr))) {
                    throw new Error(`IP allocation ${ip} does not belong to any configured subnet.`);
                }
                if (allocation.deviceId && !deviceIds.has(allocation.deviceId)) {
                    throw new Error(`IP ${ip} references missing device ${allocation.deviceId}.`);
                }
            }

            // Repair recoverable device/IPAM drift instead of rejecting an otherwise usable state.
            // The device record is the source of truth for its primary IP, hostname and notes.
            for (const device of state.devices) {
                if (!device.primaryIp) continue;

                const existing = state.ipAllocations[device.primaryIp];
                if (!existing || !isPlainObject(existing)) {
                    state.ipAllocations[device.primaryIp] = {
                        status: 'Assigned',
                        deviceId: device.id,
                        hostname: device.name || '',
                        notes: device.notes || ''
                    };
                    continue;
                }

                // Repair a stale/missing device link while preserving allocation-specific fields.
                if (existing.deviceId !== device.id || existing.status !== (device.ipReserved ? 'Reserved' : 'Assigned')) {
                    existing.deviceId = device.id;
                    existing.status = device.ipReserved ? 'Reserved' : 'Assigned';
                }
                existing.hostname = device.name || '';
                existing.notes = device.notes || '';
            }

            // A device primary IP cannot be simultaneously assigned to another device.
            for (const [ip, allocation] of Object.entries(state.ipAllocations)) {
                if (allocation.deviceId) {
                    const owner = state.devices.find(d => d.id === allocation.deviceId);
                    if (!owner) {
                        allocation.deviceId = '';
                        if (allocation.status === 'Assigned') allocation.status = 'Available';
                    }
                    if (owner && owner.primaryIp !== ip) {
                        allocation.deviceId = '';
                        if (allocation.status === 'Assigned') allocation.status = 'Available';
                    }
                }
            }

            return state;
        }

        function validateApplicationState() {
            const errors = [];
            // Apply the same hierarchy rules during live integrity checks as on import.
            errors.push(...hierarchyValidate(appState.subnets));
            errors.push(...hierarchyValidateTypes(appState.subnets));
            const subnetIds = new Set();
            const vlanNumbers = new Set();
            const deviceIds = new Set();
            const primaryIps = new Map();

            appState.subnets.forEach(subnet => {
                if (!subnet.id || subnetIds.has(subnet.id)) errors.push(`Duplicate or missing subnet ID: ${subnet.id || '(missing)'}`);
                subnetIds.add(subnet.id);
                // Containers, reservations and loopbacks have no VLAN/gateway.
                // Their CIDR and type rules are checked by hierarchyValidateTypes above.
                if (subnet.kind && subnet.kind !== 'network') return;
                if (!isValidCidr24(subnet.cidr)) errors.push(`Invalid subnet CIDR: ${subnet.cidr}`);
                if (!isValidIpv4(subnet.gateway) || !ipBelongsToSubnet(subnet.gateway, subnet.cidr)) errors.push(`Invalid gateway for subnet ${subnet.name || subnet.cidr}.`);
                const vlan = Number(subnet.vlan);
                if (!Number.isInteger(vlan) || vlan < 1 || vlan > 4094 || vlanNumbers.has(vlan)) errors.push(`Invalid or duplicate VLAN ${subnet.vlan}.`);
                vlanNumbers.add(vlan);
            });

            appState.devices.forEach(device => {
                if (!device.id || deviceIds.has(device.id)) errors.push(`Duplicate or missing device ID: ${device.id || '(missing)'}`);
                deviceIds.add(device.id);
                if (device.location === 'Blank') errors.push(`Device ${device.name} still uses the retired Blank location.`);
                if (device.primaryIp) {
                    if (primaryIps.has(device.primaryIp)) errors.push(`Duplicate primary IP: ${device.primaryIp}.`);
                    primaryIps.set(device.primaryIp, device.id);
                    const subnet = appState.subnets.find(s => ipBelongsToSubnet(device.primaryIp, s.cidr));
                    if (!subnet) errors.push(`Primary IP ${device.primaryIp} on ${device.name} has no subnet.`);
                    const allocation = appState.ipAllocations[device.primaryIp];
                    if (!allocation || allocation.deviceId !== device.id || allocation.status !== (device.ipReserved ? 'Reserved' : 'Assigned')) errors.push(`IPAM is out of sync for ${device.name} (${device.primaryIp}).`);
                }
                if (device.rackId) {
                    const rack = appState.racks.find(r => r.id === device.rackId);
                    if (!rack) errors.push(`Device ${device.name} references a missing rack.`);
                    if (device.mountType !== 'Rack Mounted' || device.location !== 'Racked') errors.push(`Rack assignment is inconsistent for ${device.name}.`);
                    if (Number(device.rackUEnd) !== Number(device.rackUStart) + Number(device.rackUHeight) - 1) errors.push(`Rack U range is inconsistent for ${device.name}.`);
                }
            });

            Object.entries(appState.ipAllocations).forEach(([ip, allocation]) => {
                if (!appState.subnets.some(s => ipBelongsToSubnet(ip, s.cidr))) errors.push(`IPAM allocation ${ip} is outside all configured subnets.`);
                if (allocation?.deviceId) {
                    const device = getDeviceById(allocation.deviceId);
                    if (!device) errors.push(`IPAM allocation ${ip} references a missing device.`);
                    else if (device.primaryIp !== ip || allocation.status !== (device.ipReserved ? 'Reserved' : 'Assigned')) errors.push(`IPAM/device mismatch for ${ip}.`);
                }
            });

            return errors;
        }

        // Caffoot Lite v1 uses its own browser storage namespace.
        const STORAGE_KEY = 'caffoot_state';

        // Phase 17A: preserve unreadable stored data. Never overwrite it on startup.
        let phase17AStorageRecovery = null;
        function loadStoredState() {
            let stored;
            try { stored = localStorage.getItem(STORAGE_KEY); }
            catch (error) {
                phase17AStorageRecovery = { reason: 'Browser storage cannot be read.', raw: null };
                console.error('Storage unavailable:', error);
                return cloneDefaultData();
            }
            if (!stored) return cloneDefaultData();
            try {
                const parsed = JSON.parse(stored);
                if (!isPlainObject(parsed) || !Array.isArray(parsed.devices) || !Array.isArray(parsed.subnets) || !Array.isArray(parsed.racks) || !isPlainObject(parsed.ipAllocations)) {
                    throw new Error('Inventory structure is missing required collections');
                }
                return normaliseState(parsed);
            } catch (error) {
                phase17AStorageRecovery = { reason: String(error.message || error), raw: stored };
                console.error('Stored inventory preserved for recovery:', error);
                return cloneDefaultData();
            }
        }

        let appState = loadStoredState();
        const startupIntegrityErrors = validateApplicationState();
        if (startupIntegrityErrors.length) console.error('Startup integrity issues:', startupIntegrityErrors);
        // Do not write on startup: it could overwrite unreadable data or mask an integrity problem.
        function phase17ARecoveryBanner() {
            if (!phase17AStorageRecovery) return;
            const banner = document.createElement('section');
            banner.id = 'phase17a-recovery';
            banner.setAttribute('role','alert');
            banner.style.cssText = 'position:fixed;z-index:99999;left:16px;right:16px;top:16px;max-width:900px;margin:auto;padding:18px;background:#7f1d1d;color:white;border:2px solid #fecaca;border-radius:14px;box-shadow:0 12px 35px #0006;font:14px system-ui';
            const heading = document.createElement('strong');
            heading.textContent = 'Caffoot Lite recovery mode — saved inventory was not loaded';
            const message = document.createElement('p');
            message.style.margin = '8px 0';
            message.textContent = 'Your existing browser data has NOT been overwritten. Changes are disabled until you recover or explicitly reset it. ' + phase17AStorageRecovery.reason;
            const download = document.createElement('button');
            download.textContent = 'Download original stored data';
            download.disabled = phase17AStorageRecovery.raw === null;
            download.style.cssText = 'background:white;color:#7f1d1d;padding:9px 12px;border-radius:8px;margin-right:8px;font-weight:700';
            download.onclick = () => {
                const blob = new Blob([phase17AStorageRecovery.raw], {type:'text/plain'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href=url; a.download='caffoot_lite_unreadable_recovery.txt'; a.click();
                setTimeout(()=>URL.revokeObjectURL(url),1000);
            };
            const reset = document.createElement('button');
            reset.textContent = 'Reset to empty inventory';
            reset.style.cssText = 'background:#fecaca;color:#450a0a;padding:9px 12px;border-radius:8px;font-weight:700';
            reset.onclick = () => {
                if (!confirm('This replaces the unreadable stored inventory with an empty Caffoot Lite inventory. Download the original data first. Continue?')) return;
                if (!confirm('Final confirmation: overwrite the existing saved inventory?')) return;
                try { localStorage.setItem(STORAGE_KEY,JSON.stringify(cloneDefaultData())); location.reload(); }
                catch (error) { alert('Reset failed: '+String(error.message||error)); }
            };
            banner.append(heading,message,download,reset);
            document.body.appendChild(banner);
        }
        let currentTab = 'dashboard';
        let selectedSubnetId = appState.subnets[0]?.id || '';
        let selectedRackId = appState.racks[0]?.id || '';
        let activeRackFace = 'front';
        let phase13DraggedDeviceId = null;
        let phase13CDraggedAccessoryId = null;
        let phase13BRackTab = 'view';
        let phase13CSelectedAccessory = 'blank';
        // Phase 6: temporarily preserve the device form while creating a missing subnet.
        let deviceFormDraft = null;
        let ipViewRange = '1-32';
        let phase12Page = 0;

        if (localStorage.getItem('caffoot_dark') === 'true') {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon')?.setAttribute('class', 'fa-solid fa-sun');
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('caffoot_dark', isDark);
            document.getElementById('theme-icon')?.setAttribute('class', isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon');
        }

        // Phase 10C: a compact, local, best-effort audit trail.
        // Audit records are metadata only; backup JSON still contains the complete inventory.
        const AUDIT_KEY = 'caffoot_audit_v1';
        const AUDIT_LIMIT = 200;
        function readAuditHistory() {
            try {
                const parsed = JSON.parse(localStorage.getItem(AUDIT_KEY) || '[]');
                return Array.isArray(parsed) ? parsed.slice(-AUDIT_LIMIT) : [];
            } catch (_) { return []; }
        }
        let auditHistory = readAuditHistory();
        let auditBaseline = JSON.stringify(appState);
        let nextAuditReason = '';
        function auditChanges(before, after) {
            const changes = [];
            const categories = [
                ['devices','Device','name'],
                ['subnets','Subnet','cidr'],
                ['racks','Rack','name'],
                ['vlans','VLAN','name']
            ];
            for (const [key,kind,labelKey] of categories) {
                const left = new Map((Array.isArray(before[key]) ? before[key] : []).map(x=>[String(x.id),x]));
                const right = new Map((Array.isArray(after[key]) ? after[key] : []).map(x=>[String(x.id),x]));
                for (const [id,item] of right) {
                    const old=left.get(id), label=String(item[labelKey] || id).slice(0,100);
                    if (!old) changes.push({action:'Created',kind,label,fields:[]});
                    else if (JSON.stringify(old)!==JSON.stringify(item)) {
                        const fields=[...new Set([...Object.keys(old),...Object.keys(item)])]
                            .filter(k=>k!=='id' && JSON.stringify(old[k])!==JSON.stringify(item[k]));
                        changes.push({action:'Updated',kind,label,fields:fields.slice(0,16)});
                    }
                }
                for (const [id,item] of left) if (!right.has(id))
                    changes.push({action:'Deleted',kind,label:String(item[labelKey] || id).slice(0,100),fields:[]});
            }
            const oldIp=before.ipAllocations || {}, newIp=after.ipAllocations || {};
            for (const ip of new Set([...Object.keys(oldIp),...Object.keys(newIp)])) {
                if (JSON.stringify(oldIp[ip]) === JSON.stringify(newIp[ip])) continue;
                const action = !(ip in oldIp) ? 'Created' : !(ip in newIp) ? 'Deleted' : 'Updated';
                changes.push({action,kind:'IPAM',label:ip,fields:action==='Updated'
                    ? [...new Set([...Object.keys(oldIp[ip] || {}),...Object.keys(newIp[ip] || {})])]
                        .filter(k=>JSON.stringify(oldIp[ip]?.[k])!==JSON.stringify(newIp[ip]?.[k])).slice(0,16) : []});
            }
            for (const key of ['deviceTypes','deviceLocations']) {
                if (JSON.stringify(before[key])!==JSON.stringify(after[key]))
                    changes.push({action:'Updated',kind:key==='deviceTypes'?'Device types':'Locations',label:'Managed list',fields:[]});
            }
            return changes;
        }
        function recordAudit(before,after,reason) {
            const changes = auditChanges(before,after);
            if (!changes.length && !reason) return;
            const event = {at:new Date().toISOString(), reason:reason || 'Inventory saved',
                changes:changes.slice(0,60), omitted:Math.max(0,changes.length-60)};
            auditHistory.push(event);
            auditHistory=auditHistory.slice(-AUDIT_LIMIT);
            try { localStorage.setItem(AUDIT_KEY,JSON.stringify(auditHistory)); }
            catch (error) { console.warn('Audit history could not be persisted:',error); showToast('Inventory saved, but audit history could not be stored. Export a backup.', 'error'); }
        }
        function exportAuditHistory() {
            const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),events:auditHistory},null,2)],{type:'application/json'});
            const url=URL.createObjectURL(blob);
            const a=document.createElement('a');
            a.href=url; a.download='caffoot_lite_audit_'+new Date().toISOString().slice(0,10)+'.json';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(()=>URL.revokeObjectURL(url),1000);
        }
        function renderAuditHTML() {
            const entries=auditHistory.slice().reverse();
            return `<div class="max-w-5xl mx-auto space-y-5">
                <section class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-2xl p-6 space-y-3">
                    <div class="flex items-center justify-between flex-wrap gap-3">
                        <div><h3 class="font-bold text-lg text-slate-900 dark:text-white">Change History</h3>
                        <p class="text-sm text-slate-700 dark:text-slate-200 mt-1">Local history of successful saves on this browser, from Phase 10C onwards. Up to ${AUDIT_LIMIT} events are retained.</p></div>
                        <button type="button" data-action="export-audit" class="px-4 py-2.5 rounded-xl bg-blue-800 hover:bg-blue-900 text-white font-semibold"><i class="fa-solid fa-download mr-2"></i>Export history</button>
                    </div>
                    <p class="text-xs text-slate-600 dark:text-slate-300">This is not a tamper-proof or multi-user audit system. Clearing browser storage removes this history. Export it separately; standard inventory backups do not include audit history. No old/new field values are stored.</p>
                </section>
                ${entries.length ? entries.map(entry=>`<article class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-2xl p-4 space-y-3">
                    <div class="flex flex-wrap justify-between gap-2"><strong class="text-slate-900 dark:text-white">${escapeHtml(entry.reason || 'Inventory saved')}</strong><time class="text-xs text-slate-600 dark:text-slate-300">${escapeHtml(new Date(entry.at).toLocaleString())}</time></div>
                    ${entry.changes.length ? `<ul class="space-y-2">${entry.changes.map(c=>`<li class="text-sm text-slate-800 dark:text-slate-200 border-l-4 ${c.action==='Deleted'?'border-rose-600':c.action==='Created'?'border-emerald-600':'border-blue-600'} pl-3"><strong>${escapeHtml(c.action)} ${escapeHtml(c.kind)}:</strong> ${escapeHtml(c.label)} ${c.fields?.length?`<span class="text-slate-600 dark:text-slate-300">(${escapeHtml(c.fields.join(', '))})</span>`:''}</li>`).join('')}</ul>`:'<p class="text-sm text-slate-700 dark:text-slate-200">Validated inventory replacement or save; no item-level differences.</p>'}
                    ${entry.omitted?`<p class="text-xs text-amber-800 dark:text-amber-200">Plus ${entry.omitted} additional changes not displayed in this event.</p>`:''}
                </article>`).join(''):'<div class="bg-white dark:bg-slate-800 border rounded-2xl p-8 text-center text-slate-700 dark:text-slate-200">No saved changes recorded yet. Create or edit a device to start the history.</div>'}
            </div>`;
        }

        function saveState() {
            if (phase17AStorageRecovery) {
                showToast('Recovery mode: saved data is protected. Export the original and resolve the storage issue first.', 'error');
                return false;
            }
            try {
                const integrityErrors = validateApplicationState();
                if (integrityErrors.length) {
                    console.error('Integrity check failed:', integrityErrors);
                    showToast(`Save blocked: ${integrityErrors[0]}`, 'error');
                    return false;
                }
                appState.stateVersion = STATE_VERSION;
                const nextSnapshot = JSON.stringify(appState);
                localStorage.setItem(STORAGE_KEY, nextSnapshot);
                if (localStorage.getItem(STORAGE_KEY) !== nextSnapshot) {
                    throw new Error('Saved data verification failed');
                }
                try { recordAudit(JSON.parse(auditBaseline), appState, nextAuditReason); }
                catch (error) { console.warn('Audit diff failed:',error); }
                auditBaseline = nextSnapshot;
                nextAuditReason = '';
                showToast('Changes saved successfully');
                return true;
            } catch (error) {
                console.error('Unable to save application state:', error);
                showToast('Unable to save changes. Storage may be full or unavailable.', 'error');
                return false;
            }
        }

        // Phase 1 data-integrity helpers
        function getDeviceById(deviceId) {
            return appState.devices.find(d => d.id === deviceId);
        }

        function findDeviceUsingIp(ip, excludeDeviceId = null) {
            if (!ip) return null;
            return appState.devices.find(d => d.primaryIp === ip && d.id !== excludeDeviceId) || null;
        }

        function setDevicePrimaryIp(device, newIp) {
            const oldIp = device.primaryIp || '';
            const trimmedIp = (newIp || '').trim();

            if (trimmedIp && findDeviceUsingIp(trimmedIp, device.id)) {
                throw new Error(`IP address ${trimmedIp} is already assigned to another device.`);
            }
            // Phase 17C: refuse to take an IPAM address owned by a different device.
            // Validate before releasing the old address so a failed edit leaves it intact.
            if (trimmedIp) {
                const gatewaySubnet = phase10GatewaySubnet(trimmedIp);
                if (gatewaySubnet && trimmedIp !== oldIp && !['Firewall', 'Router', 'Layer 3 Switch'].includes(device.type)) {
                    throw new Error(`Gateway ${trimmedIp} may only be assigned to a Firewall, Router or Layer 3 Switch.`);
                }
                if (!appState.subnets.some(subnet => ipBelongsToSubnet(trimmedIp, subnet.cidr))) {
                    throw new Error(`IP address ${trimmedIp} is not in a configured subnet.`);
                }
                const allocation = appState.ipAllocations[trimmedIp];
                if (allocation?.deviceId && allocation.deviceId !== device.id) {
                    throw new Error(`IP address ${trimmedIp} is linked to another device in IPAM.`);
                }
                if (allocation?.reservedForDeviceId && allocation.reservedForDeviceId !== device.id) {
                    throw new Error(`IP address ${trimmedIp} is reserved for another device.`);
                }
                if (trimmedIp !== oldIp && allocation && !allocation.deviceId &&
                    ['Reserved', 'Assigned'].includes(allocation.status) &&
                    allocation.reservedForDeviceId !== device.id) {
                    throw new Error(`IP address ${trimmedIp} is already ${allocation.status.toLowerCase()} in IPAM.`);
                }
            }

            if (oldIp && appState.ipAllocations[oldIp]?.deviceId === device.id) {
                delete appState.ipAllocations[oldIp];
            }

            device.primaryIp = trimmedIp;

            if (trimmedIp) {
                const existing = appState.ipAllocations[trimmedIp] || {};
                appState.ipAllocations[trimmedIp] = {
                    ...existing,
                    status: device.ipReserved ? 'Reserved' : 'Assigned',
                    deviceId: device.id,
                    hostname: device.name || existing.hostname || '',
                    notes: device.notes || existing.notes || ''
                };
            }
        }

        // Keep the IPAM record in sync when any device details change.
        // The device remains the source of truth for its primary IP allocation.
        function syncDeviceIpamRecord(device) {
            if (!device?.primaryIp) return;

            const existing = appState.ipAllocations[device.primaryIp] || {};
            appState.ipAllocations[device.primaryIp] = {
                ...existing,
                status: device.ipReserved ? 'Reserved' : 'Assigned',
                deviceId: device.id,
                hostname: device.name || '',
                notes: device.notes || ''
            };
        }

        function validateRackPlacement(deviceId, rackId, face, startU, endU = startU) {
            const rack = appState.racks.find(r => r.id === rackId);
            if (!rack) return 'Selected rack no longer exists.';

            const start = Number(startU);
            const end = Number(endU);
            const rackHeight = Number(rack.heightU);

            if (!Number.isInteger(start) || !Number.isInteger(end)) {
                return 'Rack U positions must be whole numbers.';
            }
            if (start < 1 || end < 1 || start > rackHeight || end > rackHeight) {
                return `Rack position must be between U1 and U${rackHeight}.`;
            }
            if (end < start) {
                return 'Rack end U cannot be below the start U.';
            }

            const overlaps = appState.devices.some(d => {
                if (d.id === deviceId || d.rackId !== rackId || (d.face || 'front') !== (face || 'front')) return false;
                const otherStart = Number(d.rackUStart);
                const otherEnd = Number(d.rackUEnd || d.rackUStart);
                if (!Number.isInteger(otherStart) || !Number.isInteger(otherEnd)) return false;
                return start <= otherEnd && end >= otherStart;
            });

            if (overlaps) {
                return `The selected U position overlaps another device on the ${face || 'front'} face.`;
            }
            if ((appState.rackAccessories || []).some(a => a.rackId === rackId && a.face === (face || 'front') && start <= Number(a.startU) + Number(a.heightU) - 1 && end >= Number(a.startU))) {
                return 'The selected U position overlaps a rack accessory.';
            }
            return null;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');

        let phase11CPreview = null;
        const PHASE11C_SNAPSHOT_KEY = 'caffoot_phase11c_pre_repair_v1';
        function phase11CPlan(state=appState) {
            const fixes=[], blocked=[];
            const owners=new Map();
            for(const d of state.devices) if(d.primaryIp) {
                if(!owners.has(d.primaryIp)) owners.set(d.primaryIp,[]);
                owners.get(d.primaryIp).push(d);
            }
            for(const [ip,devices] of owners) {
                if(devices.length!==1) { blocked.push(`Duplicate primary IP ${ip}: manual resolution required.`); continue; }
                const d=devices[0], existing=state.ipAllocations[ip];
                if(!state.subnets.some(n=>ipBelongsToSubnet(ip,n.cidr))) {
                    blocked.push(`${d.name}: ${ip} has no matching subnet.`); continue;
                }
                if(existing?.deviceId && existing.deviceId!==d.id) {
                    blocked.push(`${ip} belongs to another IPAM record (${existing.deviceId}). Review manually.`); continue;
                }
                if(existing && !existing.deviceId && existing.status && existing.status!=='Available') {
                    blocked.push(`${ip} is ${existing.status} without a matching owner. Review manually.`); continue;
                }
                const expected={status:d.ipReserved?'Reserved':'Assigned',deviceId:d.id,hostname:d.name||'',notes:d.notes||''};
                if(!existing || Object.entries(expected).some(([k,v])=>existing[k]!==v)) {
                    fixes.push({ip,deviceId:d.id,name:d.name,expected,
                        reason:existing?'Synchronise device-owned IPAM fields':'Create missing device IPAM allocation'});
                }
            }
            for(const [ip,a] of Object.entries(state.ipAllocations)) {
                if(a?.deviceId && !state.devices.some(d=>d.id===a.deviceId && d.primaryIp===ip))
                    blocked.push(`${ip} has a stale or orphaned IPAM link. Review manually.`);
                if(a?.reservedForDeviceId && !state.devices.some(d=>d.id===a.reservedForDeviceId))
                    blocked.push(`${ip} has an orphaned reservation. Review manually.`);
            }
            for(const d of state.devices) if(d.rackId && !state.racks.some(r=>r.id===d.rackId))
                blocked.push(`${d.name} refers to a missing rack. Review manually.`);
            return {fixes,blocked};
        }

        function phase11CApplyRepair() {
            if(!phase11CPreview) return showToast('Run a repair preview first.','error');
            if(JSON.stringify(appState)!==phase11CPreview.snapshot) {
                phase11CPreview=null;renderContent();
                return showToast('Inventory changed. Preview repairs again.','error');
            }
            const {fixes}=phase11CPreview.plan;
            if(!fixes.length) return showToast('No safe repairs are pending.','error');
            if(!confirm(`Apply ${fixes.length} proposed IPAM repair(s)? A pre-repair snapshot will be stored first. Conflicts are not changed.`)) return;
            const before=JSON.stringify(appState);
            const previousSnapshot=localStorage.getItem(PHASE11C_SNAPSHOT_KEY);
            try {
                // Snapshot must persist before any in-memory changes are made.
                localStorage.setItem(PHASE11C_SNAPSHOT_KEY,before);
                for(const f of fixes) {
                    const d=appState.devices.find(d=>d.id===f.deviceId && d.primaryIp===f.ip);
                    if(!d) throw new Error('A device changed during repair.');
                    const existing=appState.ipAllocations[f.ip] || {};
                    if(existing.deviceId && existing.deviceId!==d.id) throw new Error('Conflicting IPAM owner.');
                    appState.ipAllocations[f.ip]={...existing,...f.expected};

        function phase10DReportData() {
            const devices=Array.isArray(appState.devices)?appState.devices:[];
            const racks=Array.isArray(appState.racks)?appState.racks:[];
            const subnets=Array.isArray(appState.subnets)?appState.subnets:[];
            const locationCounts=new Map();
            for (const d of devices) {
                const location=String(d.location || 'Unknown');
                locationCounts.set(location,(locationCounts.get(location)||0)+1);
            }
            const rackRows=racks.map(r=>{
                const height=Number(r.heightU)||0;
                const installed=devices.filter(d=>d.rackId===r.id);
                // Front and rear occupancy are separately reported to avoid combining
                // distinct faces as if they were one physical space.
                const occupancy=face=>installed.filter(d=>(d.face||'front')===face)
                    .reduce((sum,d)=>{
                        const a=Number(d.rackUStart),b=Number(d.rackUEnd??d.rackUStart);
                        return sum+(Number.isInteger(a)&&Number.isInteger(b)&&b>=a?b-a+1:0);
                    },0);
                const front=occupancy('front'),rear=occupancy('rear');
                const percent=height?Math.round(Math.max(front,rear)/height*100):0;
                return {name:r.name||r.id,height,front,rear,devices:installed.length,percent};

        let phase15cDashboardTab = 'overview';

        function renderDashboardHTML() {

            const rackCapacity = racks.reduce((sum, r) => sum + (Number(r.heightU) || 0), 0);

                return sum + (end - start + 1);
            }, 0);
            const freeUs = Math.max(0, rackCapacity - occupiedUs);
            const occupancyPct = rackCapacity ? Math.min(100, Math.round((occupiedUs / rackCapacity) * 100)) : 0;

            const typeCounts = devices.reduce((map, d) => {

            const topTypes = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]).slice(0, 6);

            const totalSubnetCapacity = subnetStats.reduce((sum, subnet) => sum + subnet.capacity, 0);
            const subnetAssigned = subnetStats.reduce((sum, subnet) => sum + subnet.assigned, 0);
            const subnetReserved = subnetStats.reduce((sum, subnet) => sum + subnet.reserved, 0);
            const ipUtilisation = totalSubnetCapacity ? Math.min(100, Math.round(((subnetAssigned + subnetReserved) / totalSubnetCapacity) * 100)) : 0;
            const reservedDeviceCount = devices.filter(d => d.primaryIp && d.ipReserved).length;
            const alerts = [];
            const deviceIds = new Set(devices.map(d => d.id));
            const seenPrimaryIps = new Set();
            devices.forEach(device => {
                if (device.primaryIp) {
                    if (seenPrimaryIps.has(device.primaryIp)) {
                        alerts.push({ level: 'danger', icon: 'fa-triangle-exclamation', text: `Duplicate primary IP: ${device.primaryIp}`, destination:'devices', deviceId:device.id });
                    }
                    seenPrimaryIps.add(device.primaryIp);
                    const allocation = allocations[device.primaryIp];
                    if (!allocation || allocation.deviceId !== device.id) {
                        alerts.push({ level: 'warning', icon: 'fa-link-slash', text: `${device.name} is not linked correctly in IPAM`, destination:'devices', deviceId:device.id });
                    }
                }
                if (device.rackId && !racks.some(r => r.id === device.rackId)) {
                    alerts.push({ level: 'danger', icon: 'fa-hard-drive', text: `${device.name} references a missing rack`, destination:'devices', deviceId:device.id });
                }
            });
            Object.entries(allocations).forEach(([ip, allocation]) => {
                if (allocation?.deviceId && !deviceIds.has(allocation.deviceId)) {
                    alerts.push({ level: 'danger', icon: 'fa-link-slash', text: `${ip} references a missing device`, destination:'ipam', ip });
                }
            });
            racks.forEach(rack => {
                const rackDevices = devices.filter(d => d.rackId === rack.id);
                const used = rackDevices.reduce((sum, d) => {
                    const start = Number(d.rackUStart);
                    const end = Number(d.rackUEnd ?? d.rackUStart);
                    return Number.isInteger(start) && Number.isInteger(end) && end >= start ? sum + (end - start + 1) : sum;
                }, 0);
                if ((Number(rack.heightU) || 0) > 0 && used / Number(rack.heightU) >= 0.85) {
                    alerts.push({ level: 'warning', icon: 'fa-gauge-high', text: `${rack.name} is ${Math.round((used / Number(rack.heightU)) * 100)}% occupied`, destination:'racks', rackId:rack.id });

            const phase15dAlerts = alerts.filter(a => phase15eAlertFilter === 'all' || (phase15eAlertFilter === 'critical' ? a.level === 'danger' : a.level !== 'danger')).slice(0, 12);

                const source = `${entry.reason || ''} ${changes.map(c => `${c.kind || ''} ${c.label || ''}`).join(' ')}`.toLowerCase();
                return phase15eActivityFilter === 'devices' ? /device/.test(source) : phase15eActivityFilter === 'network' ? /ipam|subnet|ip address|allocation|vlan/.test(source) : /rack|accessory|mount/.test(source);
            }).slice(0, 8);
            const phase15dTimeline = phase15dAudit.length ? phase15dAudit.map(entry => {

                const changes = Array.isArray(entry.changes) ? entry.changes : [];
                const preview = changes.slice(0, 3).map(change => `<li><strong>${escapeHtml(change.action || 'Changed')} ${escapeHtml(change.kind || 'record')}:</strong> ${escapeHtml(change.label || '')}</li>`).join('');
                return `<article class="phase15d-event"><span class="phase15d-event-dot" aria-hidden="true"></span><div class="min-w-0"><div class="flex flex-wrap justify-between gap-2"><strong class="text-sm text-slate-900 dark:text-white">${escapeHtml(entry.reason || 'Inventory saved')}</strong><time class="text-xs text-slate-600 dark:text-slate-300">${escapeHtml(time)}</time></div>${preview ? `<ul class="mt-1.5 text-xs text-slate-600 dark:text-slate-300 space-y-1">${preview}</ul>` : '<p class="text-xs text-slate-600 dark:text-slate-300 mt-1">Inventory saved without item-level changes.</p>'}${changes.length>3?`<p class="mt-1 text-xs text-slate-500">+${changes.length-3} more changes</p>`:''}</div></article>`;
            }).join('') : `<p class="phase15e-no-results">${phase15eActivityFilter === 'all' ? 'No recent saved changes on this browser.' : 'No saved changes match this filter.'}</p>`;

                </div>`).join('') : `<p class="text-sm text-slate-500 dark:text-slate-400">No subnets configured.</p>`;

            // Phase 15B visual insights are computed from current application state.
            const insightSegment = (label, value, total, colour) => `<div class="phase15b-legend-row"><span class="phase15b-dot ${colour}"></span><span>${escapeHtml(label)}</span><strong>${value}</strong><span class="phase15b-muted">${total ? Math.round(value / total * 100) : 0}%</span></div>`;
            const statusCounts = devices.reduce((map, d) => { const key = String(d.status || 'Active').trim() || 'Active'; map[key] = (map[key] || 0) + 1; return map; }, {});
            const statusEntries = Object.entries(statusCounts).sort((a,b) => b[1] - a[1]);
            const statusColours = ['#059669','#3b82f6','#f59e0b','#64748b','#a855f7','#e11d48'];

            const rackInsights = racks.map(rack => {

            const networkInsights = `<section class="phase15b-insights" aria-label="Network insights">

        function getCategoryIcon(type) {
            switch(type) {
                case 'Server': return 'fa-server';

                case 'PDU': return 'fa-bolt';
                case 'Patch Panel': return 'fa-plug';
                case 'NAS': case 'Storage': return 'fa-hard-drive';
                case 'UPS': return 'fa-battery-full';
                default: return 'fa-microchip';
            }
        }

        // Phase 13G: lightweight, offline rack fascias configured per managed device type.
        const phase13GPresets = {automatic:'Automatic',switch24:'24-port switch',switch48:'48-port switch',server:'Server',router:'Router / firewall',storage:'Storage / NAS',ups:'UPS / PDU',plain:'Plain front panel'};
        function phase13GDefault(type) {
            const t=String(type||'').toLowerCase();
            if(t.includes('switch'))return 'switch24';
            if(t.includes('server'))return 'server';
            if(t.includes('router')||t.includes('firewall'))return 'router';
            if(t.includes('nas')||t.includes('storage'))return 'storage';
            if(t.includes('ups')||t.includes('pdu'))return 'ups';
            return 'plain';
        }
        function phase13GFascia(type) {
            const chosen=appState.deviceTypeGraphics?.[type];
            const preset=phase13GPresets[chosen]&&chosen!=='automatic'?chosen:phase13GDefault(type);
            const ports=count=>`<span class="phase13g-ports">${Array.from({length:count},(_,i)=>`<i title="Port ${i+1}"></i>`).join('')}</span>`;
            let contents='';
            if(preset==='switch24'||preset==='switch48')contents=ports(preset==='switch48'?48:24);
            else if(preset==='server')contents='<span class="phase13g-bays"><i></i><i></i><i></i><i></i></span><span class="phase13g-led"></span>';
            else if(preset==='router')contents='<span class="phase13g-led"></span>'+ports(6);
            else if(preset==='storage')contents='<span class="phase13g-bays"><i></i><i></i><i></i><i></i><i></i><i></i></span>';
            else if(preset==='ups')contents='<span class="phase13g-led"></span><span class="phase13g-display">POWER</span>';
            else contents='<span class="phase13g-display">'+escapeHtml(type||'DEVICE')+'</span>';
            return `<span class="phase13g-fascia phase13g-${preset}" title="${escapeHtml(type||'Device')} front panel" aria-hidden="true">${contents}</span>`;
        }
        function phase13GOpenGraphics(type) {
            if(!getUniqueDeviceTypes().includes(type))return;
            const current=appState.deviceTypeGraphics?.[type]||'automatic';
            openModal(`<div class="p-6 space-y-4"><div class="flex items-center justify-between"><h3 class="font-bold text-lg text-slate-900 dark:text-white">Rack graphic: ${escapeHtml(type)}</h3><button data-action="close-modal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm text-slate-600 dark:text-slate-300">Choose a front-panel design for every rack-mounted device of this type. This does not affect inventory or rack placement.</p><label class="block text-sm font-semibold text-slate-900 dark:text-white">Graphic style<select id="phase13g-style" class="phase13c-field">${Object.entries(phase13GPresets).map(([key,label])=>`<option value="${key}" ${current===key?'selected':''}>${label}</option>`).join('')}</select></label><div class="flex justify-end gap-2"><button type="button" data-action="open-manage-types" class="phase13b-secondary">Cancel</button><button type="button" data-action="phase13g-save" data-name="${escapeHtml(type)}" class="phase13b-primary">Save Graphic</button></div></div>`);
        }
        function phase13GSaveGraphics(type) {
            const choice=document.getElementById('phase13g-style')?.value;
            if(!getUniqueDeviceTypes().includes(type)||!Object.hasOwn(phase13GPresets,choice))return;
            if(!isPlainObject(appState.deviceTypeGraphics))appState.deviceTypeGraphics={};
            if(choice==='automatic')delete appState.deviceTypeGraphics[type];
            else appState.deviceTypeGraphics[type]=choice;
            saveState();openManageTypesModal();renderContent();
        }
        // Phase 13L: calculate occupancy by unique U slots, not by summing item heights.
        let phase13LHeight = 1;
        function phase13LUsage(rack, face) {
            const used = new Set();
            const height = Number(rack.heightU) || 0;
            appState.devices.filter(d => d.rackId === rack.id && (d.face || 'front') === face).forEach(d => {
                for (let u = Number(d.rackUStart); u <= Number(d.rackUEnd || d.rackUStart); u++) {
                    if (Number.isInteger(u) && u >= 1 && u <= height) used.add(u);
                }
            });
            (appState.rackAccessories || []).filter(a => a.rackId === rack.id && a.face === face).forEach(a => {
                for (let u = Number(a.startU); u < Number(a.startU) + Number(a.heightU); u++) {
                    if (Number.isInteger(u) && u >= 1 && u <= height) used.add(u);
                }
            });
            return {occupied:used.size, available:Math.max(0,height-used.size), capacity:height, percent:height?Math.round(used.size/height*100):0};
        }
        function phase13LFreeRuns(rack, face, requiredHeight = 1) {
            const height = Number(rack.heightU) || 0;
            const needed = Number(requiredHeight);
            if (!Number.isInteger(needed) || needed < 1 || needed > height) return [];
            const result = [];
            for (let start = 1; start + needed - 1 <= height; start++) {
                if (!validateRackPlacement(null, rack.id, face, start, start + needed - 1)) result.push(start);
            }
            return result;
        }
        function phase13LPrintRack(rackId) {
            const rack = appState.racks.find(r=>r.id===rackId);
            if (!rack) { showToast('Rack not found.', 'error'); return; }
            const w=window.open('','_blank');
            if (!w) { showToast('Allow pop-ups to print the rack elevation.', 'error'); return; }
            const safe = value => escapeHtml(String(value ?? ''));
            const pages=['front','rear'].map(face=>{
                const usage=phase13LUsage(rack,face);
                const slots=Array.from({length:Number(rack.heightU)},(_,i)=>Number(rack.heightU)-i).map(u=>{
                    const d=appState.devices.find(d=>d.rackId===rack.id&&(d.face||'front')===face&&Number(d.rackUStart)<=u&&Number(d.rackUEnd||d.rackUStart)>=u);
                    const a=(appState.rackAccessories||[]).find(a=>a.rackId===rack.id&&a.face===face&&Number(a.startU)<=u&&Number(a.startU)+Number(a.heightU)-1>=u);
                    const item=d||a;
                    const name=d?.name||a?.name||'';
                    const cls=d?'device':a?'accessory':'empty';
                    const first=d?u===Number(d.rackUEnd||d.rackUStart):a?u===Number(a.startU)+Number(a.heightU)-1:false;
                    return `<tr class="${cls}"><th>U${u}</th><td>${item&&first?safe(name):item?'↳':''}</td></tr>`;
                }).join('');
                return `<section><h2>${face==='front'?'Front':'Rear'} elevation</h2><p>${usage.occupied}U occupied · ${usage.available}U available · ${usage.percent}% utilised</p><table>${slots}</table></section>`;
            }).join('');
            w.document.open();
            w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${safe(rack.name)} — Rack elevations</title><style>body{font:13px system-ui,sans-serif;color:#0f172a;margin:20px}h1{margin:0 0 4px}section{break-before:page;page-break-before:always}section:first-of-type{break-before:auto;page-break-before:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}tr{height:19px}th{width:55px;background:#1e293b;color:#fff;font-size:10px}td{padding:1px 12px;text-align:center;font-weight:600;border:1px solid #94a3b8}.device td{background:#14532d;color:white}.accessory td{background:#334155;color:white}.empty td{background:#f1f5f9}p{color:#475569}@media print{body{margin:8mm}section{break-inside:avoid}thead{display:table-header-group}}</style></head><body><h1>${safe(rack.name)}</h1><p>${safe(rack.location||'')} · ${safe(rack.heightU)}U · Printed ${safe(new Date().toLocaleString())}</p>${pages}</body></html>`);
            w.document.close();
            w.focus();
            // User initiates the browser print/PDF flow explicitly via the toolbar.
            w.print();
        }

        function renderRacksHTML() {
            const currentRack = appState.racks.find(r => r.id === selectedRackId) || appState.racks[0];

            if (!currentRack) {
                return `
                    <div class="space-y-6 text-center py-12">
                        <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto text-slate-400 text-xl">
                            <i class="fa-solid fa-hard-drive"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white">No Network Racks Defined</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Create a rack enclosure to begin mounting hardware equipment.</p>
                        <button data-action="open-rack-modal" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold shadow-md">Add Network Rack</button>
                    </div>
                `;
            }

            const rackDevices = appState.devices.filter(d => d.rackId === currentRack.id);
            const faceDevices = rackDevices.filter(d => (d.face || 'front') === activeRackFace);
            const rackAccessories=(appState.rackAccessories||[]).filter(a=>a.rackId===currentRack.id);
            const faceAccessories=rackAccessories.filter(a=>a.face===activeRackFace);

            const faceUUsed = faceDevices.reduce((acc, d) => {
                const height = (parseInt(d.rackUEnd || d.rackUStart) - parseInt(d.rackUStart) + 1) || 1;
                return acc + height;
            }, 0);
            const accessoryUUsed=faceAccessories.reduce((sum,a)=>sum+a.heightU,0);
            const totalCapacityPercent = Math.min(100, Math.round(((faceUUsed+accessoryUUsed) / currentRack.heightU) * 100));

            const uMap = {};
            faceDevices.forEach(d => {
                const start = parseInt(d.rackUStart);
                const end = parseInt(d.rackUEnd || d.rackUStart);
                const minU = Math.min(start, end);
                const maxU = Math.max(start, end);
                for (let u = minU; u <= maxU; u++) {
                    uMap[u] = { device: d, isTopSlot: u === maxU };
                }
            });

            faceAccessories.forEach(a=>{for(let u=a.startU;u<a.startU+a.heightU;u++)uMap[u]={accessory:a,isTopSlot:u===a.startU+a.heightU-1};});
            let rackSlotsHtml = '';
            const heightU = currentRack.heightU || 42;

            for (let u = heightU; u >= 1; u--) {
                const occupancy = uMap[u];
                if (occupancy) {
                    if (occupancy.accessory) {
                        if(occupancy.isTopSlot){
                            const a=occupancy.accessory, kind=phase13CAccessoryTypes[a.type]||phase13CAccessoryTypes.blank;

                        }
                        continue;
                    }
                    if (occupancy.isTopSlot) {
                        const dev = occupancy.device;
                        const start = parseInt(dev.rackUStart);
                        const end = parseInt(dev.rackUEnd || dev.rackUStart);
                        const span = Math.abs(end - start) + 1;
                        const isRear = dev.face === 'rear';
                        const badgeBg = isRear ? 'bg-purple-600 text-white' : 'bg-emerald-600 text-white';
                        const borderCol = isRear 
                            ? 'border-purple-300 dark:border-purple-800 bg-purple-50/90 dark:bg-purple-950/40' 
                            : 'border-emerald-300 dark:border-emerald-800 bg-emerald-50/90 dark:bg-emerald-950/40';

                        rackSlotsHtml += `
                            <div draggable="true" data-rack-device="${escapeHtml(dev.id)}" data-rack-drop-u="${u}" data-rack-drop-id="${escapeHtml(currentRack.id)}" style="height: ${span * 40}px;" title="${escapeHtml(dev.name)} · ${escapeHtml(dev.type)} · ${escapeHtml(dev.primaryIp||'No IP')} · ${span}U · ${dev.face||'front'}" class="phase13-device phase13i-rack-item border-b border-slate-200 dark:border-slate-800 ${borderCol} transition hover:brightness-105 shadow-sm relative group">
                                <span class="phase13j-u" aria-label="Rack position">${span===1?`U${start}`:`U${start}–${end}`}</span>
                                <span class="phase13i-name" title="${escapeHtml(dev.name)}">${escapeHtml(dev.name)}</span>
                                <div class="phase13i-actions">
                                    <button data-action="assign-device" data-rack-id="${escapeHtml(currentRack.id)}" data-u="${start}" class="phase13i-action" title="Edit placement" aria-label="Edit rack placement for ${escapeHtml(dev.name)}"><i class="fa-solid fa-pen"></i></button>
                                    <button data-action="unassign-device" data-id="${escapeHtml(dev.id)}" class="phase13i-action text-rose-600" title="Remove from rack" aria-label="Remove ${escapeHtml(dev.name)} from rack"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    }
                    continue;
                } else {
                    rackSlotsHtml += `
                        <button type="button" aria-label="Place equipment at U${u} on ${activeRackFace} of ${escapeHtml(currentRack.name)}" data-action="phase18b-place" data-rack-drop-u="${u}" data-rack-drop-id="${escapeHtml(currentRack.id)}" data-rack-id="${escapeHtml(currentRack.id)}" data-u="${u}" class="phase13-empty w-full h-10 border-b border-dashed border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 hover:bg-emerald-50/50 dark:hover:bg-emerald-950/20 cursor-pointer transition group">
                            <span class="text-xs font-mono font-bold text-slate-700 dark:text-slate-200 group-hover:text-emerald-800 dark:group-hover:text-emerald-200">U${u}</span>
                            <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200 opacity-100 transition group-hover:text-emerald-800 dark:group-hover:text-emerald-200"><i class="fa-solid fa-plus mr-1" aria-hidden="true"></i> Place here (${activeRackFace})</span>
                        </button>
                    `;
                }
            }

            return `
                <div class="space-y-5 phase13b-workspace">
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 sm:p-5 space-y-3">
                        <div><h2 class="text-lg font-bold text-slate-900 dark:text-white">Rack Workspace</h2><p class="text-sm text-slate-600 dark:text-slate-300">Visualise equipment, review placements, or manage rack properties in separate sections.</p></div>
                        <nav class="phase13b-tabs" aria-label="Rack workspace sections">
                            ${[['view','Rack view','fa-server'],['equipment','Equipment','fa-list'],['settings','Rack settings','fa-gear']].map(([tab,label,icon])=>`<button type="button" data-action="phase13b-tab" data-tab="${tab}" aria-current="${phase13BRackTab===tab?'page':'false'}" class="phase13b-tab ${phase13BRackTab===tab?'phase13b-selected':''}"><i class="fa-solid ${icon} mr-2"></i>${label}</button>`).join('')}
                        </nav>
                    </div>
                    <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
                        <div class="flex items-center space-x-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                            ${appState.racks.map(r => `
                                <button data-action="select-rack" data-id="${escapeHtml(r.id)}" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${r.id === currentRack.id ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'}">
                                    <i class="fa-solid fa-server mr-2"></i>${escapeHtml(r.name)}
                                </button>
                            `).join('')}
                        </div>

                        <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
                            <div class="flex items-center bg-slate-100 dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
                                <button data-action="rack-face-front" aria-pressed="${activeRackFace === 'front'}" class="px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider transition flex items-center space-x-1.5 ${activeRackFace === 'front' ? 'bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}">
                                    <i class="fa-solid fa-desktop"></i>
                                    <span>Front</span>
                                </button>
                                <button data-action="rack-face-rear" aria-pressed="${activeRackFace === 'rear'}" class="px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider transition flex items-center space-x-1.5 ${activeRackFace === 'rear' ? 'bg-white dark:bg-slate-800 text-purple-600 dark:text-purple-400 shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}">
                                    <i class="fa-solid fa-server"></i>
                                    <span>Rear</span>
                                </button>
                            </div>
                            <div class="${phase13BRackTab==='settings'?'flex':'hidden'} items-center gap-2 flex-wrap">
                            <button data-action="edit-rack" data-id="${escapeHtml(currentRack.id)}" class="px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold transition" title="Edit Rack Properties">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button data-action="delete-rack" data-id="${escapeHtml(currentRack.id)}" class="px-3 py-2 bg-rose-50 dark:bg-rose-950/50 hover:bg-rose-100 text-rose-600 dark:text-rose-400 rounded-xl text-xs font-semibold transition border border-rose-200 dark:border-rose-800" title="Delete Rack">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                            <button data-action="open-rack-modal" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition shadow-sm">
                                <i class="fa-solid fa-plus mr-1"></i> New Rack
                            </button>
                            </div>
                        </div>
                    </div>

                    <section class="${phase13BRackTab==='view'?'':'hidden'} space-y-4" aria-label="Visual rack view">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden flex flex-col">
                            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <span class="w-3 h-3 rounded-full ${activeRackFace === 'front' ? 'bg-emerald-500' : 'bg-purple-500'}"></span>
                                    <h3 class="font-bold text-base text-slate-900 dark:text-white">${escapeHtml(currentRack.name)} — <span class="uppercase text-sm ${activeRackFace === 'front' ? 'text-emerald-600 dark:text-emerald-400' : 'text-purple-600 dark:text-purple-400'}">${activeRackFace} View</span></h3>
                                </div>
                                <span class="text-xs text-slate-500 font-medium">${faceDevices.length+faceAccessories.length} mounted items • ${totalCapacityPercent}% U utilized</span>
                            </div>

                            <div class="phase17d-rack-scroll p-6 overflow-y-auto custom-scrollbar bg-slate-100 dark:bg-slate-900/80" data-rack-scroll="true" tabindex="0" aria-label="Scrollable rack elevation">
                                <div class="phase13k-elevation max-w-5xl mx-auto bg-white dark:bg-slate-800 border-2 border-slate-300 dark:border-slate-700 rounded-xl shadow-inner overflow-hidden">
                                    <div class="bg-slate-800 text-slate-200 px-4 py-2 text-xs font-bold flex justify-between uppercase tracking-wider">
                                        <span>Rack Unit (U)</span>
                                        <span>Mounted Equipment (${activeRackFace.toUpperCase()} Panel)</span>
                                        <span>Status / IP</span>
                                    </div>
                                    <div class="flex flex-col">
                                        ${rackSlotsHtml}
                                    </div>
                                    <div class="bg-slate-800 text-slate-400 px-4 py-2 text-xs text-center font-mono">
                                        ${escapeHtml(currentRack.location || 'Server Room')} • Total Height: ${currentRack.heightU}U
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
