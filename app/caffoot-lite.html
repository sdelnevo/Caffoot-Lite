        function handleAssignSubmit(e, rackId, defaultSlot) {
            e.preventDefault();
            const before = JSON.stringify(appState);
            const deviceId = document.getElementById('assign-device-id')?.value;
            if (!deviceId) { showToast('Select a device from inventory before mounting.', 'error'); return; }
            const face = document.getElementById('assign-face').value;
            const uStart = parseInt(document.getElementById('assign-u-start').value);

            const device = appState.devices.find(d => d.id === deviceId);
            if (!device || device.mountType !== 'Rack Mounted' || !phase19BAllowedMounts(device.type).includes('Rack Mounted')) {
                showToast('Only devices configured as Rack Mounted can be placed in a rack.', 'error');
                return;
            }
            if (device) {
                const height = Math.max(1, Number(device.rackUHeight) || (Number(device.rackUEnd) - Number(device.rackUStart) + 1) || 1);
                const endU = uStart + height - 1;
                const validationError = validateRackPlacement(device.id, rackId, face, uStart, endU);
                if (validationError) {
                    showToast(validationError, 'error');

                device.rackId = rackId;
                device.face = face;
                device.rackUStart = uStart;
                device.rackUEnd = endU;
                device.rackUHeight = height;
                device.mountType = 'Rack Mounted';

        function getSubnetForIp(ip) {
            if(!isValidIpv4(ip)) return null;
            return appState.subnets.find(subnet=>phase12Usable(ip,subnet.cidr))||null;
        }
        function refreshDeviceIpOptions() {
            const subnetSelect = document.getElementById('dev-subnet');
            const ipInput = document.getElementById('dev-ip');
            const select = document.getElementById('dev-ip-available');
            const hint = document.getElementById('dev-ip-hint');
            if (!subnetSelect || !ipInput || !select) return;
            const subnet = appState.subnets.find(s => s.id === subnetSelect.value);
            select.innerHTML = '<option value="">Select next available IP...</option>';
            if (!subnet) {
                ipInput.disabled = true;
                select.disabled = true;
                ipInput.value = '';
                if (hint) hint.textContent = 'Select an existing subnet before entering an IP address.';
                return;
            }
            const range = phase12Cidr(subnet.cidr);
            if (!range) {
                ipInput.disabled = true;
                select.disabled = true;
                if (hint) hint.textContent = 'This subnet has an invalid address range.';
                return;
            }
            const currentIp = ipInput.value.trim();
            const editingId = document.querySelector('[data-device-form="true"]')?.dataset.deviceId || '';
            const used = new Set(Object.keys(appState.ipAllocations || {}));
            appState.devices.forEach(d => { if (d.primaryIp && d.id !== editingId) used.add(d.primaryIp); });
            const available = [];
            let count = 0;
            for (let n = range.first; n <= range.lastHost; n++) {
                const ip = phase12IpString(n);
                if (ip === subnet.gateway && ip !== currentIp) continue;
                if (!used.has(ip) || (ip === currentIp && appState.devices.some(d => d.id === editingId && d.primaryIp === ip))) {
                    count++;
                    if (available.length < 50) available.push(ip);
                }
            }
            select.innerHTML = '<option value="">Select next available IP...</option>' +
                available.map(ip => `<option value="${escapeHtml(ip)}" ${ip === currentIp ? 'selected' : ''}>${escapeHtml(ip)}${ip === currentIp ? ' (current)' : ''}</option>`).join('');
            select.disabled = available.length === 0;
            ipInput.disabled = false;
            ipInput.placeholder = 'Enter an IP or choose above';
            if (hint) hint.textContent = `${subnet.name || subnet.cidr} · ${count} available · showing first ${available.length} · gateway excluded`;
        }

        function handleDeviceIpSelection() {
            const select = document.getElementById('dev-ip-available');
            const input = document.getElementById('dev-ip');
            if (select && input && select.value) {
                input.value = select.value;
                input.dispatchEvent(new Event('input', { bubbles: true }));
            }

        function handleDeviceSubnetChange() {
            const select = document.getElementById('dev-subnet');
            const ip = document.getElementById('dev-ip');
            if (!select || !ip) return;
            const subnet = appState.subnets.find(s => s.id === select.value);
            const current = getSubnetForIp(ip.value.trim());
            if (!subnet || !current || current.id !== subnet.id) ip.value = '';

        // Phase 19C: read-only details follow the same order as the Add/Edit form.
        // Use the current managed labels, including renamed software and server functions.
        function phase19CDetailLabel(key, type) {
            if (phase19BTypeGroups[String(type || '').toLowerCase().trim()] === 'router' && key === 'networkConnection') return 'WAN connection method';
            const managed = [...phase19BServerFunctions(), ...phase19BSoftware()].find(item => item.key === key);
            return managed?.label || phase19BLabels[key] || key;
        }
        function phase19CDetailRows(device, field) {
            const details = device.typeDetails && typeof device.typeDetails === 'object' ? device.typeDetails : {};
            const keys = phase19BFieldsFor(device.type);
            // Retain access to historical values even when a managed option was removed.
            const historical = Object.keys(details).filter(key => !keys.includes(key) && details[key] !== '' && details[key] !== null && details[key] !== undefined);
            const allKeys = [...keys, ...historical];
            const flags = new Set([...phase19BFlags, ...phase19BServerFunctionFields(), ...phase19BSoftwareFields()]);
            const rows = allKeys.filter(key => details[key] !== '' && details[key] !== null && details[key] !== undefined)
                .map(key => {
                    const value = details[key];
                    const display = typeof value === 'boolean' ? (value ? 'Yes' : 'No') : value;
                    return field(phase19CDetailLabel(key, device.type), display);
                });
            return rows.join('');
        }
        function phase14CViewDevice(deviceId) {
            const d = appState.devices.find(device => String(device.id) === String(deviceId));
            if (!d) return showToast('Device not found.', 'error');
            const rack = appState.racks.find(r => String(r.id) === String(d.rackId));

            const mounted = !!d.rackId && !!rack;
            const uStart = Number(d.rackUStart);

            const uText = mounted && Number.isFinite(uStart) && uStart > 0
                ? `U${uStart}${Number.isFinite(uEnd) && uEnd > uStart ? '–U' + uEnd : ''}` : 'Not assigned';
            const safe = value => escapeHtml(value === undefined || value === null || value === '' ? '—' : String(value));

            const rackRows = mounted ? field('Rack', rack.name) + field('Face', d.face || 'front') + field('U position', uText) + field('Height', (Number(d.rackUHeight) || (uEnd-uStart+1) || 1) + 'U') : '';
            openModal(`<div class="phase14c-detail space-y-5 p-5 sm:p-7">

                    <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">${safe(d.type)} · ${safe(d.location)} · <span class="font-semibold">${safe(status)}</span></p></div>
                    <button type="button" data-action="close-modal" aria-label="Close device details" class="phase14c-close"><i class="fa-solid fa-xmark"></i></button>
                </header>
                ${section('Device details', 'fa-circle-info', field('Device name', d.name) + field('Type', d.type) + field('Status', status))}
                ${section('Hardware & lifecycle', 'fa-microchip', hardware + (detailRows ? `<div class="phase19c-detail-subheading">Additional ${safe(d.type)} details</div>${detailRows}` : ''))}
                ${section('Mounting & location', 'fa-location-dot', field('Mounting', d.mountType || (mounted ? 'Rack Mounted' : 'Desktop')) + field('Location', d.location) + rackRows)}
                ${section('Network identity', 'fa-network-wired', field('Primary IP', d.primaryIp) + field('Subnet', subnet ? (subnet.cidr || subnet.name || subnet.network || subnet.id) : 'Not linked') + field('IP reserved', d.ipReserved ? 'Yes' : 'No'))}
                ${d.notes ? `<section class="phase14c-section"><h4><i class="fa-solid fa-note-sticky mr-2" aria-hidden="true"></i>Notes</h4><p class="phase14c-notes">${safe(d.notes)}</p></section>` : ''}
                <footer class="phase19d1-actions">

        function phase14CGoToRack(deviceId) {

        function duplicateDevice(deviceId) {
            const source = getDeviceById(deviceId);
            if (!source) return showToast('Device not found.', 'error');
            const subnet = source.primaryIp ? getSubnetForIp(source.primaryIp) : null;
            const mounted = source.mountType === 'Rack Mounted' || !!source.rackId;
            const height = Math.max(1, Number(source.rackUHeight) || (Number(source.rackUEnd) - Number(source.rackUStart) + 1) || 1);
            const draft = {
                deviceId:null, duplicatedFrom:source.id, name:'', primaryIp:'',
                subnetId:subnet?.id || '', type:source.type || '',
                location:source.location || '', mountType:mounted ? 'Rack Mounted' : (source.mountType || 'Desktop'),
                rackId:mounted ? source.rackId || '' : '', face:source.face || 'front',
                rackUHeight:height, rackUStart:1, ipReserved:!!source.ipReserved,
                status:source.status || 'Active', manufacturer:source.manufacturer || '',
                model:source.model || '', serialNumber:'', notes:source.notes || '', typeDetails:{...(source.typeDetails||{})}
            };
            if (mounted && source.rackId) {
                const rack = appState.racks.find(r => r.id === source.rackId);

        function handleDeviceSubmit(e, deviceId) {
            e.preventDefault();

            const type = document.getElementById('dev-type').value;
            const mountType = document.getElementById('dev-mount-type').value;
            const location = document.getElementById('dev-location').value;
            const subnetId = document.getElementById('dev-subnet').value;
            const primaryIp = document.getElementById('dev-ip').value.trim();
            const ipReserved = document.getElementById('dev-ip-reserved').checked;
            const status = document.getElementById('dev-status').value;
            const manufacturer = document.getElementById('dev-manufacturer').value.trim();
            const model = document.getElementById('dev-model').value.trim();
            const serialNumber = document.getElementById('dev-serial').value.trim();
            if (!['Active','Maintenance','Retired'].includes(status)) return showToast('Invalid device status.', 'error');
            const notes = document.getElementById('dev-notes').value.trim();
            const typeDetails = phase19BReadFields();
            if (!name) return showToast('Please enter a device name.', 'error');
            if (appState.devices.some(d => String(d.id) !== String(deviceId || '') && String(d.name || '').trim().toLowerCase() === name.toLowerCase())) return showToast('A device with this name already exists. Please enter a unique device name.', 'error');
            if (!type) return showToast('Please select a device type.', 'error');
            if (!mountType || !phase19BAllowedMounts(type).includes(mountType)) return showToast('Please select a valid mounting option for this device type.', 'error');
            if (!location) return showToast('Please select a location.', 'error');
            if (!subnetId) return showToast('Please select an existing subnet.', 'error');
            if (!primaryIp) return showToast('Please enter a primary IP address.', 'error');
            const subnet = appState.subnets.find(s => s.id === subnetId);
            const matchingSubnet = getSubnetForIp(primaryIp);
            if (!subnet || !matchingSubnet || matchingSubnet.id !== subnet.id) return showToast('The primary IP must belong to the selected existing subnet.', 'error');
            if (findDeviceUsingIp(primaryIp, deviceId)) return showToast(`IP address ${primaryIp} is already assigned to another device.`, 'error');
            let rackId = '', face = 'front', rackUStart = null, rackUEnd = null, rackUHeight = null;
            if (mountType === 'Rack Mounted') {
                if (location !== 'Racked') return showToast('Rack Mounted devices must use the Racked location.', 'error');
                rackId = document.getElementById('dev-rack-id').value; face = document.getElementById('dev-rack-face').value;
                rackUStart = parseInt(document.getElementById('dev-rack-u').value, 10); rackUHeight = parseInt(document.getElementById('dev-rack-height').value, 10);
                if (!Number.isInteger(rackUStart) || !Number.isInteger(rackUHeight) || rackUStart < 1 || rackUHeight < 1) return showToast('Please enter a valid rack start U and U height.', 'error');
                rackUEnd = rackUStart + rackUHeight - 1;
                const validationError = validateRackPlacement(deviceId, rackId, face, rackUStart, rackUEnd);
                if (validationError) return showToast(validationError, 'error');
            }
            const existingDevice = deviceId ? getDeviceById(deviceId) : null;
            const beforeDeviceSave = JSON.stringify(appState);
            if (existingDevice) {
                Object.assign(existingDevice, {status, manufacturer, model, serialNumber, typeDetails});
                existingDevice.ipReserved = ipReserved;
                existingDevice.name = name; existingDevice.type = type; existingDevice.mountType = mountType; existingDevice.location = location; existingDevice.notes = notes;
                existingDevice.rackId = rackId; existingDevice.face = face; existingDevice.rackUStart = rackUStart; existingDevice.rackUEnd = rackUEnd; existingDevice.rackUHeight = rackUHeight;
                try { setDevicePrimaryIp(existingDevice, primaryIp); syncDeviceIpamRecord(existingDevice); } catch (error) { appState = JSON.parse(beforeDeviceSave); return showToast('Device/IPAM update cancelled: ' + error.message, 'error'); }
            } else {
                const newDevice = { id: 'dev_' + Date.now(), name, type, mountType, location, notes, status, manufacturer, model, serialNumber, typeDetails, ipReserved, primaryIp: '', rackId, face, rackUStart, rackUEnd, rackUHeight };
                appState.devices.push(newDevice);
                try { setDevicePrimaryIp(newDevice, primaryIp); syncDeviceIpamRecord(newDevice); } catch (error) { appState = JSON.parse(beforeDeviceSave); return showToast('Device/IPAM creation cancelled: ' + error.message, 'error'); }
            }
            if (!saveState()) {
                appState = JSON.parse(beforeDeviceSave);
                showToast('Device changes were not saved. Previous data restored.', 'error');
                return;
            }
            closeModal(true); renderContent();
        }

            const related=Object.keys(appState.ipAllocations).filter(ip=>appState.ipAllocations[ip]?.deviceId===deviceId);
            const reserved=Object.keys(appState.ipAllocations).filter(ip=>appState.ipAllocations[ip]?.reservedForDeviceId===deviceId);
            const message=`Delete device ${device.name}?\n\nPrimary IP: ${device.primaryIp||'none'}\nLinked IPAM records: ${related.length}\nOther reservations: ${reserved.length}\nRack: ${device.rackId?'mounted':'not mounted'}\n\nThis cannot be undone. Export a backup first.`;
            if(!confirm(message)) return;
            const before=JSON.stringify(appState);
            for(const ip of related) delete appState.ipAllocations[ip];

            phase11BCommitDelete(before,'Device');
        }

        // Manual release checks never read or send inventory, or change browser storage.
        function caffootCompareVersions(left, right) {
            const parse = value => {
                const match = /^(?:v)?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(value);
                if (!match) throw new Error('Release version is not recognised.');
                const pre = match[4] ? match[4].split('.') : [];
                if (pre.some(part => !part || (/^\d+$/.test(part) && part.length > 1 && part[0] === '0'))) throw new Error('Release version is not recognised.');
                return {numbers:match.slice(1,4).map(BigInt), pre};
            };
            const a = parse(left), b = parse(right);
            for (let i=0;i<3;i++) if (a.numbers[i] !== b.numbers[i]) return a.numbers[i] > b.numbers[i] ? 1 : -1;
            if (!a.pre.length || !b.pre.length) return a.pre.length === b.pre.length ? 0 : a.pre.length ? -1 : 1;
            for (let i=0;i<Math.max(a.pre.length,b.pre.length);i++) {
                if (a.pre[i] === undefined) return -1;
                if (b.pre[i] === undefined) return 1;
                if (a.pre[i] === b.pre[i]) continue;
                const an = /^\d+$/.test(a.pre[i]), bn = /^\d+$/.test(b.pre[i]);
                if (an && bn) return BigInt(a.pre[i]) > BigInt(b.pre[i]) ? 1 : -1;
                if (an !== bn) return an ? -1 : 1;
                return a.pre[i] > b.pre[i] ? 1 : -1;
            }
            return 0;
        }

        let caffootUpdateChecking = false;
        async function caffootCheckUpdates() {
            if (caffootUpdateChecking) return;
            const status = document.getElementById('caffoot-update-status');
            if (!status) return;
            if (typeof navigator !== 'undefined' && navigator.onLine === false) {
                status.textContent = 'You are offline. You can keep using Caffoot Lite and follow the safe update guide later.';
                return;
            }
            caffootUpdateChecking = true;
            status.textContent = 'Checking official published releases…';
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
                const response = await fetch('https://api.github.com/repos/sdelnevo/Caffoot-Lite/releases/latest', {signal:controller.signal, credentials:'omit', referrerPolicy:'no-referrer', headers:{Accept:'application/vnd.github+json'}});
                if (response.status === 404) {
                    status.textContent = 'No public release is available yet, or the repository is private. Your current version is ' + CAFFOOT_LITE_VERSION + '.';
                    return;
                }

                const release = await response.json();
                if (!release || release.draft !== false || release.prerelease !== false || typeof release.tag_name !== 'string') throw new Error('Invalid release');
                const newer = caffootCompareVersions(release.tag_name, CAFFOOT_LITE_VERSION) > 0;
                status.textContent = newer ? 'A newer release (' + release.tag_name + ') is available. Download a JSON backup, then follow the safe update guide.' : 'No newer stable release is available. Current version: ' + CAFFOOT_LITE_VERSION + '.';
            } catch (error) {
                status.textContent = 'Could not check releases. Check your connection or visit Official releases in the safe update guide. Your inventory has not changed.';
            } finally {
                clearTimeout(timeout);
                caffootUpdateChecking = false;
            }
        }

        function phase16ACheckSafety() {
            try {
                const issues = validateApplicationState();
                const key = typeof STORAGE_KEY !== 'undefined' ? STORAGE_KEY : 'caffoot_state';
                const stored = localStorage.getItem(key);
                if (!stored) issues.push('No saved inventory was found in browser storage.');
                else {
                    try {
                        const saved = normaliseState(JSON.parse(stored));
                        const current = normaliseState(JSON.parse(JSON.stringify(appState)));
                        if (JSON.stringify(saved) !== JSON.stringify(current))
                            issues.push('The saved inventory differs from the currently displayed inventory.');
                    } catch (error) {
                        issues.push('Saved browser inventory cannot be read: ' + error.message);
                    }
                }
                if (issues.length) {
                    window.alert('INVENTORY SAFETY CHECK — ACTION REQUIRED\n\n' +
                        issues.slice(0, 12).map((issue, i) => (i + 1) + '. ' + issue).join('\n') +
                        (issues.length > 12 ? '\n...and ' + (issues.length - 12) + ' more issue(s).' : '') +
                        '\n\nExport a JSON backup before making changes.');
                    return;
                }
                window.alert('INVENTORY SAFETY CHECK PASSED\n\n' +
                    appState.devices.length + ' devices, ' + appState.racks.length + ' racks, ' +
                    appState.subnets.length + ' subnets and ' + Object.keys(appState.ipAllocations).length +
                    ' IPAM records checked.\n\nBrowser storage matches the active inventory. ' +
                    'Keep a downloaded JSON backup as well: browser storage is not a permanent backup.');
            } catch (error) {
                window.alert('INVENTORY SAFETY CHECK FAILED\n\n' + error.message +
                    '\n\nExport a JSON backup before making changes.');
            }
        }

        function phase16AClearSystem() {
            if (phase17AStorageRecovery) {
                showToast('Recovery mode: saved data is protected. Resolve storage issues before resetting.', 'error');
                return;
            }
            const summary = [
                appState.devices.length + ' devices',
                appState.racks.length + ' racks',
                appState.subnets.length + ' subnets'
            ].join(', ');
            if (!window.confirm([
                'WARNING: RESET CAFFOOT LITE TO A CLEAN START',
                '',
                'Current inventory: ' + summary,
                '',
                'ALL inventory, IPAM records, managed server options and software options will be replaced.',
                '',
                'Download a JSON backup first if you want to keep this data.',
                '',
                'Press OK to reset or Cancel to keep everything.'
            ].join('\n'))) return;
            const original = appState;
            const key = typeof STORAGE_KEY !== 'undefined' ? STORAGE_KEY : 'caffoot_state';
            let previousSaved, previousSafety;
            try {
                previousSaved = localStorage.getItem(key);
                previousSafety = localStorage.getItem(SAFETY_SNAPSHOT_KEY);
                const snapshot = previousSaved || JSON.stringify(original);
                const cleanStart = cloneDefaultData();
                cleanStart.managedOptionsCleared = true;
                const candidate = phase16CCheckBackup(cleanStart);
                localStorage.setItem(SAFETY_SNAPSHOT_KEY, snapshot);
                if (localStorage.getItem(SAFETY_SNAPSHOT_KEY) !== snapshot)
                    throw new Error('Could not verify the recovery snapshot.');
                appState = candidate;
                nextAuditReason = 'Clean inventory reset';
                if (!saveState()) throw new Error('Could not save the clean inventory.');
                const stored = localStorage.getItem(key);
                if (!stored || JSON.stringify(normaliseState(JSON.parse(stored))) !== JSON.stringify(candidate))
                    throw new Error('Could not verify the clean inventory in browser storage.');

                showToast('Caffoot Lite has been reset to a clean inventory.', 'success');

                appState = original;

                        if (previousSaved === null) localStorage.removeItem(key);

                    if (previousSafety !== undefined) {
                        if (previousSafety === null) localStorage.removeItem(SAFETY_SNAPSHOT_KEY);
                        else localStorage.setItem(SAFETY_SNAPSHOT_KEY, previousSafety);
                    }
                    // Storage writes can silently fail. Verify both restored values before allowing edits.
                    if (previousSaved !== undefined && localStorage.getItem(key) !== previousSaved)
                        throw new Error('Inventory rollback verification failed.');
                    if (previousSafety !== undefined && localStorage.getItem(SAFETY_SNAPSHOT_KEY) !== previousSafety)
                        throw new Error('Safety snapshot rollback verification failed.');
                } catch (rollbackError) {
                    phase17AStorageRecovery = { reason: 'Clean reset rollback could not be verified. Further saves are blocked.', raw: previousSaved === undefined ? null : previousSaved };

                    console.error('Reset rollback failed:', rollbackError);
                    showToast('Reset failed; storage rollback failed. Further saves are blocked; export the original stored data from the recovery banner.', 'error');
                    renderContent();
                    return;
                }
                renderContent();
                console.error('Clean inventory reset failed:', error);

        const CAFFOOT_BACKUP_FORMAT = 'caffoot-inventory';
        const CAFFOOT_BACKUP_SCHEMA_VERSION = 1;

        // Phase 11A: safety snapshots are kept separately from active inventory.
        const SAFETY_SNAPSHOT_KEY = 'caffoot_phase11_pre_restore';
        // Reject dangerous object keys before migration, merging or rendering imported JSON.
        function phase16CRejectUnsafeKeys(root) {
            const blocked = new Set(['__proto__', 'prototype', 'constructor']);
            const pending = [root];
            const visited = new WeakSet();
            while (pending.length) {
                const value = pending.pop();
                if (!value || typeof value !== 'object' || visited.has(value)) continue;
                visited.add(value);
                for (const key of Object.keys(value)) {
                    if (blocked.has(key)) throw new Error('Backup contains a prohibited object property.');
                    const child = value[key];
                    if (child && typeof child === 'object') pending.push(child);
                }
            }

        function phase11ValidateBackupShape(raw) {
            if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('Backup must be a JSON object.');
            const required = ['devices', 'subnets', 'racks'];
            for (const key of required) {
                if (!Array.isArray(raw[key])) throw new Error(`Backup is missing a valid ${key} array.`);
                if (raw[key].length > 50000) throw new Error(`Backup contains too many ${key} records.`);
            }
            if (!raw.ipAllocations || typeof raw.ipAllocations !== 'object' || Array.isArray(raw.ipAllocations))
                throw new Error('Backup is missing a valid IP allocation table.');

                throw new Error('Backup contains too many IP allocations.');
            for (const key of required) {

            }
            return true;
        }

        function phase11SafetyPanelHTML() {
            const exists = !!personalSafeStorageGet(SAFETY_SNAPSHOT_KEY);

        // Phase 16C: inspect an imported file without changing the saved inventory.
        function phase16CCheckBackup(raw) {

            phase20ValidateBackupVersion(raw);

                issues = validateApplicationState();
            } finally {
                appState = original;
            }
            if (issues.length) throw new Error(`Inventory integrity check found ${issues.length} issue(s): ${issues.slice(0, 4).join('; ')}${issues.length > 4 ? '; and more' : ''}`);

        }
        function phase16CReadJson(contents) {
            try { return JSON.parse(contents); }
            catch (error) { throw new Error('This file is not valid JSON. Select a Caffoot Lite or older compatible JSON backup (not a CSV export). ' + error.message); }

            const input = event.target;

                input.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const raw = phase16CReadJson(reader.result);
                    const candidate = phase16CCheckBackup(raw);
                    const summary = `${candidate.devices.length} devices, ${candidate.racks.length} racks, ${candidate.subnets.length} subnets, ${Object.keys(candidate.ipAllocations).length} IPAM records`;
                    const currentSummary = `${appState.devices.length} devices, ${appState.racks.length} racks, ${appState.subnets.length} subnets`;
                    if (!confirm(`Backup validation passed.\n\nFile: ${file.name}\nBackup: ${summary}\nCurrent inventory: ${currentSummary}\n\nRestore will REPLACE your current inventory. A verified safety snapshot will be created first.\n\nContinue?`)) return;
                    // Capture the current inventory before any restore or rollback operation.
                    const original = appState;
                    // A failed safety-snapshot write blocks replacement. Existing data stays untouched.
                    const currentSnapshot = localStorage.getItem(STORAGE_KEY) || JSON.stringify(original);
                    const previousSafetySnapshot = localStorage.getItem(SAFETY_SNAPSHOT_KEY);

                        localStorage.setItem(SAFETY_SNAPSHOT_KEY, currentSnapshot);

                    } catch (snapshotError) {

                    }

                    const key = typeof STORAGE_KEY !== 'undefined' ? STORAGE_KEY : 'caffoot_state';
                    // saveState handles storage errors; do not replace active state on a failed save.
                    appState = candidate;
                    nextAuditReason = 'Backup restored';
                    try {
                        if (!saveState()) throw new Error('Browser storage rejected the backup.');
                        const stored = localStorage.getItem(key);
                        if (!stored || JSON.stringify(normaliseState(JSON.parse(stored))) !== JSON.stringify(candidate))
                            throw new Error('Saved backup verification failed.');
                    } catch (error) {

                            localStorage.setItem(key, currentSnapshot);

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <label class="phase13h-label">Face<select name="face" class="phase13c-field"><option value="front" ${face==='front'?'selected':''}>Front</option><option value="rear" ${face==='rear'?'selected':''}>Rear</option></select></label>
                      <label class="phase13h-label">Start U<input name="startU" type="number" min="1" max="${Number(rack.heightU)}" required class="phase13c-field" value="${start}"></label>
                      <label class="phase13h-label">Height (U)<input name="heightU" type="number" min="1" max="12" required class="phase13c-field" value="${height}"></label>
                    </div>
                  </fieldset>
                  <p id="phase13c-error" role="alert" aria-live="polite" class="text-sm text-rose-600 dark:text-rose-400 min-h-5"></p>
                  <div class="flex flex-wrap justify-end gap-3 pt-2 border-t border-slate-200 dark:border-slate-600"><button type="button" data-action="close-modal" class="phase13b-secondary">Cancel</button><button type="submit" class="phase13b-primary">${existing?'Save changes':'Place accessory'}</button></div>
                </form>
            </div>`;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            modal.querySelector('#phase13c-form [name="type"]').addEventListener('change',event=>{
                modal.querySelector('#phase13e-port-field').classList.toggle('hidden',event.target.value!=='patch');
            });
            modal.querySelector('#phase13c-form').addEventListener('submit',event=>{
                event.preventDefault();
                const data=new FormData(event.currentTarget);
                const candidate={id:existing?.id||('acc-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)),rackId,type:String(data.get('type')),name:String(data.get('name')).trim(),face:String(data.get('face')),startU:Number(data.get('startU')),heightU:Number(data.get('heightU')),portCount:String(data.get('type'))==='patch'?Number(data.get('portCount')):null};
                const error=(candidate.type==='patch' && ![12,24,48].includes(candidate.portCount))?'Choose a valid patch panel port count.':phase13CAccessoryError(candidate,existing?.id);
                if(error){modal.querySelector('#phase13c-error').textContent=error;return;}
                const before=JSON.stringify(appState);
                if(!Array.isArray(appState.rackAccessories))appState.rackAccessories=[];
                if(existing)Object.assign(existing,candidate);else appState.rackAccessories.push(candidate);
                if(!saveState()){appState=JSON.parse(before);return;}
                closeModal();activeRackFace=candidate.face;renderContent();
            });
        }
        function phase13CDeleteAccessory(id){
            const accessory=(appState.rackAccessories||[]).find(a=>a.id===id);
            if(!accessory||!confirm(`Remove ${accessory.name||phase13CAccessoryTypes[accessory.type]?.label||'accessory'} from this rack?`))return;
            const before=JSON.stringify(appState);
            appState.rackAccessories=appState.rackAccessories.filter(a=>a.id!==id);
            if(!saveState()){appState=JSON.parse(before);return;}renderContent();
        }
        function phase13CMoveAccessory(id,rackId,startU){
            const a=(appState.rackAccessories||[]).find(x=>x.id===id);
            if(!a)return false;
            const candidate={...a,rackId,face:activeRackFace,startU:Number(startU)};
            const error=phase13CAccessoryError(candidate,id);
            if(error){showToast(error,'error');return false;}
            const before=JSON.stringify(appState);Object.assign(a,candidate);
            if(!saveState()){appState=JSON.parse(before);return false;}phase17dRenderPreservingRackScroll();return true;
        }

        // Phase 13A: single validated pathway for drag/drop and accessible click-to-move.
        function phase13MoveDevice(deviceId, rackId, targetU) {
            const device = appState.devices.find(d => d.id === deviceId);
            if (!device || !rackId) { showToast('Device or rack was not found.', 'error'); return false; }
            const height = Math.max(1, Number(device.rackUHeight) || (Number(device.rackUEnd) - Number(device.rackUStart) + 1) || 1);
            const start = Number(targetU);
            const end = start + height - 1;
            const error = validateRackPlacement(device.id, rackId, activeRackFace, start, end);
            if (error) { showToast(error, 'error'); return false; }
            const before = JSON.stringify(appState);
            device.rackId = rackId;
            device.face = activeRackFace;
            device.rackUStart = start;
            device.rackUEnd = end;
            device.rackUHeight = height;
            device.mountType = 'Rack Mounted';
            device.location = 'Racked';
            if (!saveState()) {
                appState = JSON.parse(before);
                showToast('Move could not be saved; original placement restored.', 'error');
                return false;
            }
            phase13DraggedDeviceId = null;
            phase17dRenderPreservingRackScroll();
            return true;
        }
        function phase13ClearDropPreview() {
            document.querySelectorAll('.phase13-drop-preview').forEach(el => el.remove());
            document.querySelectorAll('.phase13-drop-target').forEach(el => el.classList.remove('phase13-drop-target'));
        }
        function phase17dRenderPreservingRackScroll() {
            const previous = document.querySelector('[data-rack-scroll="true"]');
            const scrollTop = previous ? previous.scrollTop : 0;
            renderContent();
            const next = document.querySelector('[data-rack-scroll="true"]');
            if (next) next.scrollTop = scrollTop;
        }
        // Phase 17D: drag near the top/bottom of the rack viewport to scroll its
        // contents, not the surrounding page. Never alter rack placement rules.
        let phase17dScrollFrame = null;
        let phase17dScrollPane = null;
        let phase17dScrollSpeed = 0;
        function phase17dStopAutoScroll() {
            if (phase17dScrollFrame !== null) cancelAnimationFrame(phase17dScrollFrame);
            phase17dScrollFrame = null;
            phase17dScrollPane = null;
            phase17dScrollSpeed = 0;
        }
        function phase17dScrollTick() {
            if (!phase13DraggedDeviceId && !phase13CDraggedAccessoryId) { phase17dStopAutoScroll(); return; }
            const pane = phase17dScrollPane;
            if (!pane || !pane.isConnected || !phase17dScrollSpeed) { phase17dStopAutoScroll(); return; }
            const oldTop = pane.scrollTop;
            pane.scrollTop = Math.max(0, Math.min(pane.scrollHeight - pane.clientHeight, oldTop + phase17dScrollSpeed));
            if (pane.scrollTop === oldTop) { phase17dStopAutoScroll(); return; }
            phase17dScrollFrame = requestAnimationFrame(phase17dScrollTick);
        }
        function phase17dTrackDrag(event) {
            if (!phase13DraggedDeviceId && !phase13CDraggedAccessoryId) return;
            const pane = document.querySelector('[data-rack-scroll="true"]');
            if (!pane) return;
            const bounds = pane.getBoundingClientRect();
            // The bottom of the rack can be below the Safari viewport when the
            // rack workspace is opened part-way down the document. Use only the
            // visible intersection, so scrolling begins before the macOS Dock.
            const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
            const visibleTop = Math.max(bounds.top, 0);
            const visibleBottom = Math.min(bounds.bottom, viewportHeight - 24);
            const visibleHeight = visibleBottom - visibleTop;
            if (visibleHeight < 35) { phase17dStopAutoScroll(); return; }
            const withinX = event.clientX >= bounds.left && event.clientX <= bounds.right;
            const withinY = event.clientY >= visibleTop - 45 && event.clientY <= visibleBottom + 45;
            if (!withinX || !withinY) { phase17dStopAutoScroll(); return; }
            // Prevent Safari from interpreting a rack drag as a document drag.
            event.preventDefault();
            if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
            const edge = Math.min(105, Math.max(28, visibleHeight * 0.35));
            const topDistance = event.clientY - visibleTop;
            const bottomDistance = visibleBottom - event.clientY;
            let speed = 0;
            if (topDistance < edge) speed = -Math.max(3, (edge - topDistance) / edge * 17);
            else if (bottomDistance < edge) speed = Math.max(3, (edge - bottomDistance) / edge * 17);
            if (!speed) { phase17dStopAutoScroll(); return; }
            phase17dScrollPane = pane;
            phase17dScrollSpeed = speed;
            if (phase17dScrollFrame === null) phase17dScrollFrame = requestAnimationFrame(phase17dScrollTick);
        }
        document.addEventListener('dragover', phase17dTrackDrag);
        document.addEventListener('dragstart', event => {
            const source = event.target.closest('[data-rack-device]');
            const accessory=event.target.closest('[data-rack-accessory]');
            if(!source&&!accessory)return;
            phase13CDraggedAccessoryId=accessory?.dataset.rackAccessory||null;
            phase13DraggedDeviceId = source?.dataset.rackDevice||null;
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', phase13DraggedDeviceId || phase13CDraggedAccessoryId || 'rack-item');
            // Safari can use the full multi-U rack row as its native drag image,
            // making it look like the entire rack is being pulled beyond the screen.
            // Replace it with a small, fixed-size label that follows the pointer.
            if (typeof event.dataTransfer.setDragImage === 'function') {
                const ghost = document.createElement('div');
                ghost.textContent = (source || accessory).querySelector('.phase13i-name')?.textContent?.trim() || 'Rack equipment';
                ghost.style.cssText = 'position:fixed;top:0;left:0;width:190px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:10px 12px;border-radius:8px;background:#14532d;color:#fff;font:600 13px system-ui;pointer-events:none;z-index:2147483647';
                document.body.appendChild(ghost);
                try { event.dataTransfer.setDragImage(ghost, 20, 20); } catch (_) {}
                requestAnimationFrame(() => ghost.remove());
            }
        });
        document.addEventListener('dragover', event => {
            const target = event.target.closest('[data-rack-drop-u]');
            if (!target || (!phase13DraggedDeviceId&&!phase13CDraggedAccessoryId)) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            const device = appState.devices.find(d => d.id === phase13DraggedDeviceId);
            const accessory=(appState.rackAccessories||[]).find(a=>a.id===phase13CDraggedAccessoryId);
            if (!device&&!accessory) return;
            const height = accessory?accessory.heightU:Math.max(1, Number(device.rackUHeight) || (Number(device.rackUEnd) - Number(device.rackUStart) + 1) || 1);
            const startU = Number(target.dataset.rackDropU);
            const rackId = target.dataset.rackDropId;
            const error = accessory?phase13CAccessoryError({...accessory,rackId,face:activeRackFace,startU},accessory.id):validateRackPlacement(device.id, rackId, activeRackFace, startU, startU + height - 1);
            if (target.classList.contains('phase13-drop-target')) return;
            phase13ClearDropPreview();
            target.classList.add('phase13-drop-target');
            const preview = document.createElement('div');
            preview.className = 'phase13-drop-preview' + (error ? ' phase13-invalid' : '');
            preview.style.height = `${height * 40}px`;
            preview.textContent = error ? `${height}U · Unavailable` : `${height}U · Drop here`;
            preview.setAttribute('aria-hidden', 'true');
            target.appendChild(preview);
        });
        document.addEventListener('dragover', event => {
            if ((!phase13DraggedDeviceId && !phase13CDraggedAccessoryId) || event.target.closest('[data-rack-drop-u]')) return;
            phase13ClearDropPreview();
        });
        document.addEventListener('drop', event => {
            phase17dStopAutoScroll();
            const target = event.target.closest('[data-rack-drop-u]');
            if (!target || (!phase13DraggedDeviceId&&!phase13CDraggedAccessoryId)) { phase13ClearDropPreview(); return; }
            event.preventDefault();
            const deviceId = phase13DraggedDeviceId, accessoryId=phase13CDraggedAccessoryId;
            phase13DraggedDeviceId = null;phase13CDraggedAccessoryId=null;
            phase13ClearDropPreview();
            if(accessoryId)phase13CMoveAccessory(accessoryId,target.dataset.rackDropId,Number(target.dataset.rackDropU));
            else phase13MoveDevice(deviceId, target.dataset.rackDropId, Number(target.dataset.rackDropU));
        });
        document.addEventListener('dragend', () => {
            phase17dStopAutoScroll();
            phase13DraggedDeviceId = null;phase13CDraggedAccessoryId=null;
            phase13ClearDropPreview();
        });

        // Phase 4: centralised event delegation for dynamically-rendered controls.
        // Buttons/links carry data-action rather than inline JavaScript. This keeps
        // user-entered values out of executable HTML attributes and means one handler
        // continues to work after renderContent() replaces #content.
        document.addEventListener('click', function(event) {
            const target = event.target.closest('[data-action]');
            if (!target) return;

            const action = target.dataset.action;
            const id = target.dataset.id;
            const name = target.dataset.name;
            if (target.matches('input[type="file"]')) return;
            event.preventDefault();

            switch (action) {
                case 'phase14g-clear-filters': deviceSearchTerm = ''; deviceTypeFilter = ''; deviceStatusFilter = ''; deviceLocationFilter = ''; deviceMountFilter = ''; renderContent(); break;
                case 'phase14-tab': if (['inventory','manage'].includes(target.dataset.tab)) { phase14DeviceTab=target.dataset.tab; renderContent(); } break;
                case 'open-device-modal': openDeviceModal(); break;
                case 'edit-device': openDeviceModal(id); break;
                case 'view-device': phase14CViewDevice(id); break;
                case 'phase14c-edit': closeModal(); openDeviceModal(id); break;
                case 'phase14c-duplicate': closeModal(); duplicateDevice(id); break;
                case 'phase14c-delete': closeModal(); deleteDevice(id); break;
                case 'phase14c-rack': phase14CGoToRack(id); break;
                case 'duplicate-device': duplicateDevice(id); break;
                case 'delete-device': deleteDevice(id); break;
                case 'phase19b-manage-software': phase19BManageSoftware(); break;
                case 'phase19b-add-software': phase19BUpdateSoftware('add'); break;
                case 'phase19b-rename-software': phase19BUpdateSoftware('rename',name); break;
                case 'phase19b-delete-software': phase19BUpdateSoftware('delete',name); break;
                case 'phase19b-manage-functions': phase19BManageFunctions(); break;
                case 'phase19b-add-function': phase19BUpdateFunction('add'); break;
                case 'phase19b-rename-function': phase19BUpdateFunction('rename',name); break;
                case 'phase19b-delete-function': phase19BUpdateFunction('delete',name); break;
                case 'phase18d-add': phase18DCommit(target.dataset.kind,'add','',document.getElementById('phase18d-new')?.value||''); break;
                case 'phase18d-search': phase18DSearch[target.dataset.kind]=document.getElementById('phase18d-search')?.value||'';phase18DOpen(target.dataset.kind); break;
                case 'phase18d-rename': phase18DRename(target.dataset.kind,name); break;
                case 'phase18d-delete': phase18DCommit(target.dataset.kind,'delete',name); break;
                case 'open-manage-types': openManageTypesModal(); break;
                case 'open-manage-locations': openManageLocationsModal(); break;
                case 'add-custom-type': addCustomTypeOption(); break;
                case 'add-custom-location': addCustomLocationOption(); break;
                case 'create-subnet-from-device': createSubnetFromDevice(); break;
                case 'delete-device-type': deleteDeviceType(name); break;
                case 'edit-device-type': editDeviceTypePrompt(name); break;
                case 'phase13g-graphic': phase13GOpenGraphics(name); break;
                case 'phase13g-save': phase13GSaveGraphics(name); break;
                case 'delete-location': deleteDeviceLocation(name); break;
                case 'edit-location': editDeviceLocationPrompt(name); break;
                case 'open-rack-modal': openRackModal(); break;
                case 'edit-rack': openRackModal(id); break;
                case 'delete-rack': deleteRack(id); break;
                case 'phase13c-add': phase13COpenAccessory(selectedRackId,1); break;
                case 'phase13c-edit': {const a=(appState.rackAccessories||[]).find(a=>a.id===id);if(a)phase13COpenAccessory(a.rackId,a.startU,id);break;}
                case 'phase13c-delete': phase13CDeleteAccessory(id); break;
                case 'phase13b-tab': if (['view','equipment','settings'].includes(target.dataset.tab)) { phase13BRackTab=target.dataset.tab; renderContent(); } break;
                case 'select-rack': selectedRackId = id; renderContent(); break;
                case 'rack-face-front': activeRackFace = 'front'; renderContent(); break;
                case 'rack-face-rear': activeRackFace = 'rear'; renderContent(); break;
                case 'rack-face-device': activeRackFace = target.dataset.face || 'front'; phase13BRackTab = 'view'; renderContent(); break;
                case 'phase13l-print': phase13LPrintRack(id || selectedRackId); break;
                case 'phase13l-height': phase13LHeight = Number(target.dataset.height) || 1; renderContent(); break;
                case 'phase13l-mount': openAssignDeviceModal(selectedRackId, Number(target.dataset.u)); break;
                case 'phase13f-mount': {
                    const rack = appState.racks.find(r => r.id === selectedRackId) || appState.racks[0];
                    if (!rack) { showToast('Create a rack first.', 'error'); break; }
                    const candidate = Array.from({length: Number(rack.heightU)}, (_, i) => i + 1).find(u => !validateRackPlacement(null, rack.id, activeRackFace, u, u));
                    openAssignDeviceModal(rack.id, candidate || 1);
                    break;
                }
                case 'phase18b-place': phase18BOpenPlacement(target.dataset.rackId, Number(target.dataset.u)); break;
                case 'phase18b-placement-device': phase18BOpenPlacement(target.dataset.rackId, Number(target.dataset.u), 'device'); break;
                case 'phase18b-placement-accessory': phase18BOpenPlacement(target.dataset.rackId, Number(target.dataset.u), 'accessory'); break;
                case 'assign-device': openAssignDeviceModal(target.dataset.rackId, Number(target.dataset.u)); break;
                case 'unassign-device': unassignDevice(id); break;
                case 'open-subnet-modal': openSubnetModal(); break;
                case 'edit-subnet': openSubnetModal(id); break;
                case 'delete-subnet': deleteSubnet(id); break;
                case 'bulk-ip': openBulkIpModal(id); break;
                case 'phase12c-tab': if (['overview','addresses','manage'].includes(target.dataset.tab)) { phase12CIpamTab=target.dataset.tab; renderContent(); } break;
                case 'phase12b-apply': phase12BApply(); break;
                case 'open-subnet-by-vlan': openSubnetModalByName(name); break;
                case 'delete-vlan': deleteVlan(id); break;
                case 'open-ip': openIpModal(target.dataset.ip); break;
                case 'phase10-next-ip': openIpModal(target.dataset.ip); break;
                case 'phase12-prev': phase12Page=Math.max(0,phase12Page-1); renderContent(); break;
                case 'phase12-next': phase12Page++; renderContent(); break;
                case 'ip-range-all': ipViewRange = 'all'; renderContent(); break;
                case 'ip-range-1-32': ipViewRange = '1-32'; renderContent(); break;
                case 'ip-range-33-64': ipViewRange = '33-64'; renderContent(); break;
                case 'ip-range-65-128': ipViewRange = '65-128'; renderContent(); break;
                case 'ip-range-129-192': ipViewRange = '129-192'; renderContent(); break;
                case 'ip-range-193-254': ipViewRange = '193-254'; renderContent(); break;
                case 'sidebar-ipam-overview': phase12CIpamTab = 'overview'; switchTab('ipam'); break;
                case 'sidebar-ipam-addresses': phase12CIpamTab = 'addresses'; switchTab('ipam'); break;
                case 'ipam-open-block': {
                    const blockId = String(target.dataset.id || '');
                    if (blockId && !appState.subnets.some(s => s.id === blockId && s.kind === 'container')) break;
                    phase12CIpamTab = 'manage';
                    switchTab('ipam');
                    const tree = document.querySelectorAll('[data-ipam-hierarchy-block]');
                    tree.forEach(item => {
                        if (blockId) item.open = item.getAttribute('data-ipam-hierarchy-block') === blockId;
                    });
                    const target = blockId ? [...tree].find(item => item.getAttribute('data-ipam-hierarchy-block') === blockId) : null;
                    if (target) target.scrollIntoView({block:'center',behavior:'instant'});
                    break;
                }
                case 'sidebar-ipam-manage': phase12CIpamTab = 'manage'; switchTab('ipam'); break;
                case 'tab-ipam': switchTab('ipam'); break;
                case 'tab-audit': switchTab('audit'); break;
                case 'export-audit': exportAuditHistory(); break;
                case 'phase16a-check-safety': phase16ACheckSafety(); break;
                case 'caffoot-licences': caffootShowLicences(); break;
                case 'caffoot-check-updates': caffootCheckUpdates(); break;
                case 'caffoot-update-guide': caffootUpdateGuide(); break;
                case 'phase11-export-backup': exportData(); break;
                case 'acknowledge-browser-storage': acknowledgeBrowserStorageNotice(); break;
                case 'phase16a-clear-system': phase16AClearSystem(); break;
                case 'phase11-download-snapshot': phase11DownloadSnapshot(); break;
                case 'phase10d-export': phase10DDownloadCsv(target.dataset.report); break;
                
                case 'tab-settings': switchTab('settings'); break;
                case 'phase16a-section': if (['backup','preferences','maintenance','about'].includes(target.dataset.section)) { phase16ASection=target.dataset.section; renderContent(); } break;
                case 'phase16a-import': document.getElementById('import-file')?.click(); break;
                case 'phase16a-theme': toggleDarkMode(); renderContent(); break;
                case 'phase11c-preview': phase11CPreviewRepair(); break;
                case 'phase11c-apply': phase11CApplyRepair(); break;
                case 'phase11c-snapshot': phase11CDownloadSnapshot(); break;
                case 'phase15e-open-alert': {
                    const destination = target.dataset.destination;
                    const deviceId = target.dataset.deviceId;
                    const rackId = target.dataset.rackId;
                    const ip = target.dataset.ip;
                    if (destination === 'devices') {
                        switchTab('devices');
                        // Open the device details when available; otherwise show the inventory.
                        if (deviceId && appState.devices.some(d => String(d.id) === String(deviceId)) && typeof phase14CViewDevice === 'function') phase14CViewDevice(deviceId);
                    } else if (destination === 'racks') {
                        switchTab('racks');
                    } else if (destination === 'ipam') {
                        switchTab('ipam');
                        if (ip && typeof openIpModal === 'function') openIpModal(ip);
                    } else switchTab('settings');
                    break;
                }
                case 'phase15c-dashboard-tab': {
                    const next = target.dataset.dashboardTab;
                    if (['overview','insights','activity'].includes(next)) {
                        phase15cDashboardTab = next;
                        renderContent();
                        const active = document.getElementById('phase15c-tab-' + next);
                        if (active) active.focus({preventScroll:true});
                    }
                    break;
                }
                case 'tab-dashboard': switchTab('dashboard'); break;
                case 'tab-devices': switchTab('devices'); break;


                case 'tab-ipam': switchTab('ipam'); break;
                case 'tab-racks': switchTab('racks'); break;
                case 'toggle-dark-mode': toggleDarkMode(); break;
                case 'export-data': exportData(); break;
                case 'cancel-subnet-modal': deviceFormDraft = null; closeModal(); break;
                case 'close-modal': closeModal(); break;
                default:
                    console.warn('Unhandled data-action:', action);
            }
        });

        window.onload = function() {
            switchTab('dashboard');
            phase17ARecoveryBanner();
        };
    </script>
